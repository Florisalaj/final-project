<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLDEN EAGLE - Sky Hunter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Arial Black',sans-serif}
canvas{display:block}
#hud{position:absolute;top:10px;left:14px;color:#FFD700;font-size:18px;pointer-events:none;text-shadow:0 0 14px rgba(255,215,0,0.9);line-height:1.7;z-index:10}
#hud span{margin-right:18px}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#FFD700;font-size:32px;text-align:center;pointer-events:none;text-shadow:0 0 40px rgba(255,215,0,0.9),0 0 80px rgba(255,150,0,0.5);line-height:1.5;white-space:pre-line;z-index:10}
#msg small{font-size:14px;color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">🦅 0</span><span id="cm">🔥 x1</span><span id="ms">❌ 0/3</span><span id="tm">⏱ 60s</span></div>
<div id="msg"></div>

<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function R(){W=C.width=innerWidth;H=C.height=innerHeight}
R();addEventListener('resize',R);

let MX=W/2,MY=H/2,started=false,gameOver=false;
C.onmousemove=e=>{MX=e.clientX;MY=e.clientY}
C.onmousedown=e=>{if(!started){started=true;return}if(!gameOver)dive()}
oncontextmenu=e=>e.preventDefault()

let score=0,combo=1,misses=0,maxMiss=3,timeLeft=60,tick=0;
let prey=[],strikes=[],particles=[];
let eagle={x:W/2,y:100,tx:W/2,ty:100,diving:false,diveT:0,targetX:0,targetY:0};
let flapTimer=0;

function reset(){
  score=0;combo=1;misses=0;timeLeft=60;tick=0;
  prey=[];strikes=[];particles=[];
  eagle={x:W/2,y:100,tx:W/2,ty:100,diving:false,diveT:0,targetX:0,targetY:0};
  gameOver=false;started=false;
  document.getElementById('msg').innerHTML='🦅 GOLDEN EAGLE 🦅\n<small>SKY HUNTER</small>\n\n👆 CLICK TO DIVE!\n<small>Aim at prey on the ground</small>';
  spawnPrey(8);
}
reset();

function spawnPrey(n){
  for(let i=0;i<n;i++){
    const t=Math.random()<0.2?'deer':Math.random()<0.5?'snake':'rabbit';
    prey.push({
      x:50+Math.random()*(W-100),y:50+Math.random()*(H-100),
      r:t==='deer'?22:t==='snake'?14:16,
      type:t,sp:t==='rabbit'?1.5+Math.random()*2:t==='snake'?0.8+Math.random():0.6+Math.random()*0.8,
      a:Math.random()*Math.PI*2,changeT:30+Math.random()*70,alive:true
    });
  }
}

function dive(){
  if(eagle.diving)return;
  eagle.diving=true;eagle.diveT=0;
  eagle.targetX=MX;eagle.targetY=MY;
}

function particlesAt(x,y,n,c,s){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=s*(0.3+Math.random());
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:15+Math.random()*20,ml:35,c,r:2+Math.random()*4});
  }
}

function update(){
  if(!started||gameOver)return;
  tick++;flapTimer+=0.25;
  if(tick%60===0){timeLeft--;if(timeLeft<=0){gameOver=true;document.getElementById('msg').innerHTML='⏰ TIME UP! ⏰\n<small>Score: '+score+'</small>\n<small>Click to restart</small>'}}

  // Eagle normal flight (when not diving)
  if(!eagle.diving){
    eagle.tx=MX;eagle.ty=Math.min(150,MY-200);
    eagle.x+=(eagle.tx-eagle.x)*0.06;
    eagle.y+=(eagle.ty-eagle.y)*0.06;
  }else{
    // Diving
    eagle.diveT++;
    const progress=Math.min(1,eagle.diveT/10);
    eagle.x=eagle.x+(eagle.targetX-eagle.x)*0.3;
    eagle.y=100+(eagle.targetY-100)*progress;
    if(progress>=1){
      // STRIKE!
      let hitAny=false;
      for(const p of prey){
        if(!p.alive)continue;
        if(Math.hypot(p.x-eagle.targetX,p.y-eagle.targetY)<p.r+50){
          p.alive=false;hitAny=true;
          const pts=p.type==='deer'?5:p.type==='snake'?2:1;
          score+=pts*combo;
          particlesAt(p.x,p.y,p.type==='deer'?40:25,'#FF0000',8);
        }
      }
      strikes.push({x:eagle.targetX,y:eagle.targetY,r:8,life:20});
      particlesAt(eagle.targetX,eagle.targetY,30,'#FFD700',10);
      if(hitAny){combo++}else{combo=1;misses++;if(misses>=maxMiss){gameOver=true;document.getElementById('msg').innerHTML='💀 HUNT FAILED 💀\n<small>Score: '+score+'</small>\n<small>Click to restart</small>'}}
      // Fly back up
      setTimeout(()=>{eagle.diving=false;eagle.y=Math.min(150,MY-200)},300);
    }
  }

  // Prey AI
  for(const p of prey){
    if(!p.alive)continue;
    p.changeT--;
    if(p.changeT<=0){p.a=Math.random()*Math.PI*2;p.changeT=30+Math.random()*80}
    p.x+=Math.cos(p.a)*p.sp;p.y+=Math.sin(p.a)*p.sp;
    if(p.x<10||p.x>W-10)p.a=Math.PI-p.a;
    if(p.y<10||p.y>H-10)p.a=-p.a;
    p.x=Math.max(15,Math.min(W-15,p.x));p.y=Math.max(15,Math.min(H-15,p.y));
  }

  // Strikes fade
  for(let i=strikes.length-1;i>=0;i--){strikes[i].r+=6;strikes[i].life--;if(strikes[i].life<=0)strikes.splice(i,1)}
  // Particles
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1)}

  // Respawn
  if(prey.filter(p=>p.alive).length<3&&!gameOver)spawnPrey(5);

  document.getElementById('sc').textContent='🦅 '+score;
  document.getElementById('cm').textContent='🔥 x'+combo;
  document.getElementById('ms').textContent='❌ '+misses+'/'+maxMiss;
  document.getElementById('tm').textContent='⏱ '+timeLeft+'s';
}

function drawEagle(x,y,scale,diving,flapAngle){
  X.save();X.translate(x,y);
  const s=scale||1;
  if(diving)X.rotate(1.2);

  // Glow
  X.shadowColor='#FFD700';X.shadowBlur=20;

  // Tail
  X.fillStyle='#8B6914';
  X.beginPath();X.moveTo(-5*s,16*s);X.quadraticCurveTo(-10*s,34*s,0,38*s);X.quadraticCurveTo(10*s,34*s,5*s,16*s);X.closePath();X.fill();

  // Body
  X.fillStyle='#DAA520';X.beginPath();X.ellipse(0,0,14*s,22*s,0,0,Math.PI*2);X.fill();
  X.fillStyle='#F0C75E';X.beginPath();X.ellipse(0,4*s,9*s,15*s,0,0,Math.PI*2);X.fill();

  // === LEFT WING (flapping!) ===
  X.save();X.translate(-8*s,-4*s);
  X.rotate(-0.5+flapAngle*0.9);
  X.fillStyle='#B8860B';
  X.beginPath();X.moveTo(0,0);X.quadraticCurveTo(-38*s,-16*s,-44*s,4*s);X.quadraticCurveTo(-30*s,14*s,0,8*s);X.closePath();X.fill();
  X.strokeStyle='#8B6914';X.lineWidth=2;X.stroke();
  X.fillStyle='#DAA520';
  X.beginPath();X.moveTo(0,2*s);X.quadraticCurveTo(-24*s,-8*s,-28*s,4*s);X.quadraticCurveTo(-18*s,9*s,0,5*s);X.closePath();X.fill();
  X.restore();

  // === RIGHT WING (flapping!) ===
  X.save();X.translate(8*s,-4*s);
  X.rotate(0.5-flapAngle*0.9);
  X.fillStyle='#B8860B';
  X.beginPath();X.moveTo(0,0);X.quadraticCurveTo(38*s,-16*s,44*s,4*s);X.quadraticCurveTo(30*s,14*s,0,8*s);X.closePath();X.fill();
  X.strokeStyle='#8B6914';X.lineWidth=2;X.stroke();
  X.fillStyle='#DAA520';
  X.beginPath();X.moveTo(0,2*s);X.quadraticCurveTo(24*s,-8*s,28*s,4*s);X.quadraticCurveTo(18*s,9*s,0,5*s);X.closePath();X.fill();
  X.restore();

  // Head
  X.fillStyle='#1a1a1a';X.beginPath();X.arc(0,-22*s,12*s,0,Math.PI*2);X.fill();
  X.fillStyle='#FFF';X.beginPath();X.arc(0,-24*s,9*s,Math.PI,0);X.fill();

  // Eyes - glowing RED
  X.fillStyle='#FFD700';X.shadowColor='#FF0000';X.shadowBlur=10;
  X.beginPath();X.arc(-5*s,-23*s,4*s,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(5*s,-23*s,4*s,0,Math.PI*2);X.fill();
  X.fillStyle='#000';X.shadowBlur=0;
  X.beginPath();X.arc(-5*s,-23*s,2*s,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(5*s,-23*s,2*s,0,Math.PI*2);X.fill();

  // Beak
  X.fillStyle='#FF8C00';
  X.beginPath();X.moveTo(-3*s,-18*s);X.lineTo(0,-10*s);X.lineTo(3*s,-18*s);X.closePath();X.fill();
  X.fillStyle='#FFD700';
  X.beginPath();X.moveTo(-3*s,-18*s);X.lineTo(0,-14*s);X.lineTo(3*s,-18*s);X.closePath();X.fill();

  // Talons
  X.strokeStyle='#FF8C00';X.lineWidth=2.5;
  X.beginPath();X.moveTo(-6*s,20*s);X.lineTo(-12*s,28*s);X.stroke();
  X.beginPath();X.moveTo(6*s,20*s);X.lineTo(12*s,28*s);X.stroke();

  X.shadowBlur=0;X.restore();
}

function draw(){
  // BRIGHT GREEN FIELD
  const grad=X.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#5a9a3a');grad.addColorStop(0.3,'#6aaa3a');grad.addColorStop(1,'#3a6a1a');
  X.fillStyle=grad;X.fillRect(0,0,W,H);

  // Grass lines
  X.strokeStyle='#4a8a2a';X.lineWidth=1;
  for(let y=20;y<H;y+=25){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}

  // Dirt spots
  X.fillStyle='#8a7a4a';
  for(let i=0;i<6;i++){X.beginPath();X.arc(100+i*200,80+(i%3)*160,40,0,Math.PI*2);X.fill()}

  // River
  X.fillStyle='#4499cc';X.beginPath();X.moveTo(0,H*0.5);X.quadraticCurveTo(W*0.4,H*0.38,W*0.7,H*0.5);X.quadraticCurveTo(W*0.85,H*0.6,W,H*0.48);X.lineTo(W,H*0.58);X.quadraticCurveTo(W*0.85,H*0.7,W*0.7,H*0.6);X.quadraticCurveTo(W*0.4,H*0.48,0,H*0.6);X.closePath();X.fill();

  // Eagle SHADOW on ground
  if(!eagle.diving){
    X.fillStyle='rgba(0,0,0,0.2)';
    X.beginPath();X.ellipse(eagle.x,eagle.y+200,28,14,-0.1,0,Math.PI*2);X.fill();
  }else{
    const sc=1+eagle.diveT/10*3;
    X.fillStyle='rgba(0,0,0,0.35)';
    X.beginPath();X.ellipse(eagle.x,eagle.y,28*sc,14*sc,-0.1,0,Math.PI*2);X.fill();
  }

  // Dead prey (blood marks)
  for(const p of prey){if(!p.alive){X.fillStyle='rgba(150,20,20,0.35)';X.beginPath();X.arc(p.x,p.y,p.r+6,0,Math.PI*2);X.fill()}}

  // LIVE PREY - BIG AND BRIGHT
  for(const p of prey){
    if(!p.alive)continue;
    // Glow circle
    X.fillStyle='rgba(255,255,200,0.15)';X.beginPath();X.arc(p.x,p.y,p.r+10,0,Math.PI*2);X.fill();

    if(p.type==='rabbit'){
      X.fillStyle='#e8c890';X.beginPath();X.ellipse(p.x,p.y,p.r,p.r*0.7,0,0,Math.PI*2);X.fill();
      X.fillStyle='#fff';X.beginPath();X.arc(p.x-4,p.y-5,4,0,Math.PI*2);X.fill();X.beginPath();X.arc(p.x+4,p.y-5,4,0,Math.PI*2);X.fill();
      X.fillStyle='#000';X.beginPath();X.arc(p.x-4,p.y-5,2,0,Math.PI*2);X.fill();X.beginPath();X.arc(p.x+4,p.y-5,2,0,Math.PI*2);X.fill();
      X.strokeStyle='#e8c890';X.lineWidth=3;X.beginPath();X.moveTo(p.x-5,p.y-10);X.lineTo(p.x-7,p.y-20);X.stroke();X.beginPath();X.moveTo(p.x+5,p.y-10);X.lineTo(p.x+7,p.y-20);X.stroke();
      // Label
      X.fillStyle='#fff';X.font='bold 10px Arial Black';X.textAlign='center';X.fillText('🐇',p.x,p.y-18);X.textAlign='start';
    }else if(p.type==='snake'){
      X.strokeStyle='#2a8a2a';X.lineWidth=7;X.lineCap='round';
      X.beginPath();X.moveTo(p.x-12,p.y+6);X.quadraticCurveTo(p.x-4,p.y-8,p.x+3,p.y);X.quadraticCurveTo(p.x+8,p.y+7,p.x+14,p.y+3);X.stroke();
      X.fillStyle='#1a5a1a';X.beginPath();X.arc(p.x+14,p.y+3,5,0,Math.PI*2);X.fill();
      X.fillStyle='#FF0000';X.beginPath();X.arc(p.x+14,p.y+3,2.5,0,Math.PI*2);X.fill();
      X.fillStyle='#fff';X.font='bold 10px Arial Black';X.textAlign='center';X.fillText('🐍',p.x,p.y-15);X.textAlign='start';
    }else if(p.type==='deer'){
      X.fillStyle='#c89440';X.beginPath();X.ellipse(p.x,p.y,p.r,p.r*0.65,0,0,Math.PI*2);X.fill();
      X.strokeStyle='#8a5a1a';X.lineWidth=3;X.beginPath();X.moveTo(p.x-8,p.y+10);X.lineTo(p.x-10,p.y+22);X.stroke();X.beginPath();X.moveTo(p.x+8,p.y+10);X.lineTo(p.x+10,p.y+22);X.stroke();
      X.beginPath();X.moveTo(p.x-4,p.y-14);X.lineTo(p.x-15,p.y-28);X.stroke();X.beginPath();X.moveTo(p.x+4,p.y-14);X.lineTo(p.x+15,p.y-28);X.stroke();
      X.fillStyle='#fff';X.font='bold 10px Arial Black';X.textAlign='center';X.fillText('🦌',p.x,p.y-22);X.textAlign='start';
    }
  }

  // Strikes
  for(const s of strikes){
    const a=s.life/20;
    X.strokeStyle=`rgba(255,200,0,${a})`;X.lineWidth=4*a;
    X.beginPath();X.arc(s.x,s.y,s.r,0,Math.PI*2);X.stroke();
  }

  // Particles
  for(const p of particles){
    const a=p.life/p.ml;X.globalAlpha=a;X.fillStyle=p.c;
    X.beginPath();X.arc(p.x,p.y,p.r,0,Math.PI*2);X.fill();
  }
  X.globalAlpha=1;

  // === THE EAGLE (ALWAYS VISIBLE!) ===
  drawEagle(eagle.x,eagle.y,1.2,eagle.diving,Math.sin(flapTimer)*0.5);

  // Crosshair
  if(started&&!gameOver){
    X.strokeStyle='#FFD700';X.lineWidth=2;X.setLineDash([6,4]);
    X.beginPath();X.arc(MX,MY,18,0,Math.PI*2);X.stroke();X.setLineDash([]);
    X.beginPath();X.moveTo(MX-26,MY);X.lineTo(MX-12,MY);X.moveTo(MX+12,MY);X.lineTo(MX+26,MY);
    X.moveTo(MX,MY-26);X.lineTo(MX,MY-12);X.moveTo(MX,MY+12);X.lineTo(MX,MY+26);
    X.stroke();
  }
}

C.addEventListener('click',()=>{if(gameOver)reset()});

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
