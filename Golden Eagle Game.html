<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLDEN EAGLE - Sky Warrior</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #000;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; overflow: hidden;
    font-family: 'Arial Black', 'Segoe UI', sans-serif;
    cursor: none;
  }
  canvas { display: block; }
  #uip {
    position: absolute; top: 10px; left: 10px;
    color: #FFD700; font-size: 16px; pointer-events: none;
    text-shadow: 0 0 10px rgba(255,215,0,0.6);
  }
  #uip span { margin-right: 20px; }
  #msgpanel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #FFD700; font-size: 36px; text-align: center; pointer-events: none;
    text-shadow: 0 0 30px rgba(255,215,0,0.8), 0 0 60px rgba(255,180,0,0.4);
  }
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="uip"><span id="scp">🦅 0</span><span id="hppp">❤️ 5</span><span id="klp">💀 0</span></div>
<div id="msgpanel"></div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// === INPUT ===
const keys = {};
let mouseX = W/2, mouseY = H/2;
let mouseDown = false;
let gameStarted = false;

window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; e.preventDefault(); });
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('mousedown', e => {
  if (!gameStarted) { gameStarted = true; return; }
  mouseDown = true;
});
canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// === PLAYER (Golden Eagle) ===
const player = {
  x: W/2, y: H/2,
  radius: 22,
  speed: 12,
  hp: 5, maxHp: 5,
  shootCD: 0,
  invTimer: 0,
  angle: 0
};

// === GAME STATE ===
let bullets = [];
let enemies = [];
let particles = [];
let goldPickups = [];
let scoreVal = 0;
let killCount = 0;
let gameOver = false;
let gameWin = false;
let waveNum = 1;
let shakeAmt = 0;
let flashAlpha = 0;
let spawnTimer = 0;
let enemiesLeft = 0;
let waveMsgTimer = 0;

// === STARS (background) ===
const stars = [];
for (let i = 0; i < 150; i++) {
  stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.5+0.5, s: Math.random()*0.5+0.2 });
}

function spawnWave() {
  waveNum++;
  const count = 5 + waveNum * 3;
  enemiesLeft = count;
  spawnTimer = 0;
  waveMsgTimer = 90;
  document.getElementById('msgpanel').textContent = '⚡ WAVE ' + waveNum + ' ⚡';
}

function spawnEnemy() {
  // Spawn from edges
  let ex, ey;
  const side = Math.floor(Math.random() * 4);
  if (side === 0) { ex = Math.random() * W; ey = -40; }
  else if (side === 1) { ex = W + 40; ey = Math.random() * H; }
  else if (side === 2) { ex = Math.random() * W; ey = H + 40; }
  else { ex = -40; ey = Math.random() * H; }

  const speedMult = 1 + (waveNum - 1) * 0.25;
  const baseSpeed = 3.5 * speedMult;

  enemies.push({
    x: ex, y: ey,
    radius: 20 + Math.random() * 15,
    speed: baseSpeed * (0.7 + Math.random() * 0.6),
    hp: 1 + Math.floor(waveNum / 3),
    maxHp: 1 + Math.floor(waveNum / 3),
    flashTimer: 0,
    attackCD: 0,
    type: Math.random() < 0.3 ? 'boss' : 'drone'
  });
  enemiesLeft--;
}

function resetGame() {
  player.x = W/2; player.y = H/2;
  player.hp = player.maxHp;
  player.shootCD = 0;
  player.invTimer = 120;
  player.angle = 0;
  bullets = [];
  enemies = [];
  particles = [];
  goldPickups = [];
  scoreVal = 0;
  killCount = 0;
  gameOver = false;
  gameWin = false;
  waveNum = 0;
  shakeAmt = 0;
  flashAlpha = 0;
  spawnTimer = 0;
  enemiesLeft = 0;
  waveMsgTimer = 0;
  gameStarted = false;
  document.getElementById('msgpanel').textContent = '🦅 GOLDEN EAGLE 🦅\n👆 CLICK TO FLY!';
  spawnWave();
}

// === SPAWN INITIAL WAVE ===
spawnWave();
document.getElementById('msgpanel').textContent = '🦅 GOLDEN EAGLE 🦅\n👆 CLICK TO FLY!';

// === PARTICLES ===
function spawnParticles(x, y, count, color, speed) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.5 + Math.random());
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 20 + Math.random()*15,
      maxLife: 35,
      color, radius: 1.5 + Math.random()*3
    });
  }
}

// === UPDATE ===
function update() {
  if (!gameStarted) return;
  if (gameOver || gameWin) { spawnTimer = 0; return; }

  // Wave message timer
  if (waveMsgTimer > 0) waveMsgTimer--;
  if (waveMsgTimer === 1) {
    document.getElementById('msgpanel').textContent = '';
  }

  // Player invincibility
  if (player.invTimer > 0) player.invTimer--;

  // Screen shake decay
  if (shakeAmt > 0) shakeAmt *= 0.85;
  if (shakeAmt < 0.1) shakeAmt = 0;
  if (flashAlpha > 0) flashAlpha *= 0.88;
  if (flashAlpha < 0.01) flashAlpha = 0;

  // === PLAYER MOVEMENT ===
  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup']) my = -1;
  if (keys['s'] || keys['arrowdown']) my = 1;
  if (keys['a'] || keys['arrowleft']) mx = -1;
  if (keys['d'] || keys['arrowright']) mx = 1;

  if (mx !== 0 || my !== 0) {
    const len = Math.hypot(mx, my);
    mx /= len; my /= len;
  }
  player.x += mx * player.speed;
  player.y += my * player.speed;
  // Clamp
  player.x = Math.max(player.radius, Math.min(W - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(H - player.radius, player.y));

  // Face mouse
  player.angle = Math.atan2(mouseY - player.y, mouseX - player.x);

  // === SHOOTING ===
  if (player.shootCD > 0) player.shootCD--;
  if (mouseDown && player.shootCD <= 0) {
    player.shootCD = 1; // MAX fire rate
    const angle = player.angle;
    bullets.push({
      x: player.x + Math.cos(angle)*20,
      y: player.y + Math.sin(angle)*20,
      vx: Math.cos(angle)*50,
      vy: Math.sin(angle)*50,
      life: 30,
      radius: 4
    });
    // Muzzle flash
    spawnParticles(player.x + Math.cos(angle)*22, player.y + Math.sin(angle)*22, 3, '#FFD700', 3);
  }

  // === BULLETS ===
  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx;
    b.y += b.vy;
    b.life--;
    if (b.life <= 0 || b.x < -50 || b.x > W+50 || b.y < -50 || b.y > H+50) {
      bullets.splice(i,1);
    }
  }

  // === ENEMIES ===
  // Spawn
  if (enemiesLeft > 0) {
    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnEnemy();
      spawnTimer = Math.max(5, 25 - waveNum);
    }
  }

  for (let i = enemies.length-1; i >= 0; i--) {
    const e = enemies[i];

    // Move toward player
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 0) {
      e.x += (dx/dist) * e.speed;
      e.y += (dy/dist) * e.speed;
    }

    // Flash decay
    if (e.flashTimer > 0) e.flashTimer--;
    if (e.attackCD > 0) e.attackCD--;

    // Attack player
    if (dist < player.radius + e.radius + 6 && e.attackCD <= 0 && player.invTimer <= 0) {
      e.attackCD = 14;
      e.flashTimer = 8;
      player.hp--;
      shakeAmt = 10;
      flashAlpha = 0.5;
      spawnParticles(player.x, player.y, 20, '#FF0000', 5);
      if (player.hp <= 0) {
        gameOver = true;
        document.getElementById('msgpanel').innerHTML = '💀 GAME OVER 💀<br><small style="font-size:18px">Score: '+scoreVal+' | Kills: '+killCount+'</small><br><small style="font-size:14px">Click to restart</small>';
      }
    }

    // Check bullet hits
    for (let j = bullets.length-1; j >= 0; j--) {
      const b = bullets[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + b.radius) {
        e.hp--;
        bullets.splice(j, 1);
        spawnParticles(b.x, b.y, 8, '#FFD700', 6);
        if (e.hp <= 0) {
          // Enemy dies
          spawnParticles(e.x, e.y, 25, e.type==='boss'?'#FF6600':'#FFD700', 7);
          scoreVal += e.type === 'boss' ? 500 : 100;
          killCount++;
          enemies.splice(i, 1);

          // Gold drop
          if (Math.random() < 0.5) {
            goldPickups.push({
              x: e.x, y: e.y,
              radius: 8,
              life: 300,
              pulse: Math.random()*Math.PI*2
            });
          }
          break;
        } else {
          e.flashTimer = 5;
        }
      }
    }
  }

  // === GOLD PICKUPS ===
  for (let i = goldPickups.length-1; i >= 0; i--) {
    const g = goldPickups[i];
    g.life--;
    g.pulse += 0.1;
    if (g.life <= 0) { goldPickups.splice(i,1); continue; }
    const dist = Math.hypot(player.x - g.x, player.y - g.y);
    if (dist < player.radius + g.radius + 10) {
      scoreVal += 250;
      spawnParticles(g.x, g.y, 12, '#FFD700', 4);
      goldPickups.splice(i,1);
    } else if (dist < 150) {
      // Magnet
      const a = Math.atan2(player.y - g.y, player.x - g.x);
      g.x += Math.cos(a) * 4;
      g.y += Math.sin(a) * 4;
    }
  }

  // === PARTICLES ===
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i,1);
  }

  // === WAVE COMPLETE ===
  if (enemiesLeft <= 0 && enemies.length === 0 && !gameOver) {
    if (waveNum >= 10) {
      gameWin = true;
      document.getElementById('msgpanel').innerHTML = '🏆 YOU WIN! 🏆<br><small style="font-size:18px">Score: '+scoreVal+' | Kills: '+killCount+'</small><br><small style="font-size:14px">Click to restart</small>';
    } else {
      spawnWave();
    }
  }

  // Update UI
  document.getElementById('scp').textContent = '🦅 ' + scoreVal;
  document.getElementById('hppp').textContent = '❤️ ' + player.hp;
  document.getElementById('klp').textContent = '💀 ' + killCount;

  // Scroll stars
  for (const s of stars) {
    s.y += s.s;
    if (s.y > H + 10) { s.y = -10; s.x = Math.random()*W; }
  }
}

// === DRAW GOLDEN EAGLE ===
function drawEagle(x, y, angle, scale) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  const s = scale || 1;

  // Glow
  ctx.shadowColor = '#FFD700';
  ctx.shadowBlur = 18;

  // Body
  ctx.fillStyle = '#DAA520';
  ctx.beginPath();
  ctx.ellipse(0, 0, 14*s, 22*s, 0, 0, Math.PI*2);
  ctx.fill();

  // Chest highlight
  ctx.fillStyle = '#F0C75E';
  ctx.beginPath();
  ctx.ellipse(0, 4*s, 9*s, 14*s, 0, 0, Math.PI*2);
  ctx.fill();

  // Left wing
  ctx.fillStyle = '#B8860B';
  ctx.beginPath();
  ctx.moveTo(-5*s, -8*s);
  ctx.quadraticCurveTo(-38*s, -18*s, -44*s, 0);
  ctx.quadraticCurveTo(-30*s, 8*s, -8*s, 5*s);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#8B6914';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Right wing
  ctx.fillStyle = '#B8860B';
  ctx.beginPath();
  ctx.moveTo(5*s, -8*s);
  ctx.quadraticCurveTo(38*s, -18*s, 44*s, 0);
  ctx.quadraticCurveTo(30*s, 8*s, 8*s, 5*s);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Wing highlights
  ctx.fillStyle = '#DAA520';
  ctx.beginPath();
  ctx.moveTo(-5*s, -5*s);
  ctx.quadraticCurveTo(-25*s, -12*s, -28*s, 0);
  ctx.quadraticCurveTo(-20*s, 5*s, -8*s, 3*s);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(5*s, -5*s);
  ctx.quadraticCurveTo(25*s, -12*s, 28*s, 0);
  ctx.quadraticCurveTo(20*s, 5*s, 8*s, 3*s);
  ctx.closePath();
  ctx.fill();

  // Head
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath();
  ctx.arc(0, -20*s, 12*s, 0, Math.PI*2);
  ctx.fill();

  // White cap
  ctx.fillStyle = '#FFF';
  ctx.beginPath();
  ctx.arc(0, -23*s, 9*s, Math.PI, 0);
  ctx.fill();

  // Eyes - glowing red
  ctx.shadowColor = '#FF0000';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(-5*s, -21*s, 3.5*s, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(5*s, -21*s, 3.5*s, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-5*s, -21*s, 1.8*s, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(5*s, -21*s, 1.8*s, 0, Math.PI*2);
  ctx.fill();

  // Beak
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#FF8C00';
  ctx.beginPath();
  ctx.moveTo(-3*s, -17*s);
  ctx.lineTo(0, -10*s);
  ctx.lineTo(3*s, -17*s);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.moveTo(-3*s, -17*s);
  ctx.lineTo(0, -14*s);
  ctx.lineTo(3*s, -17*s);
  ctx.closePath();
  ctx.fill();

  // Talons
  ctx.strokeStyle = '#FF8C00';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-6*s, 20*s); ctx.lineTo(-10*s, 28*s); ctx.moveTo(-6*s, 24*s); ctx.lineTo(-2*s, 29*s);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(6*s, 20*s); ctx.lineTo(10*s, 28*s); ctx.moveTo(6*s, 24*s); ctx.lineTo(2*s, 29*s);
  ctx.stroke();

  // Tail
  ctx.fillStyle = '#8B6914';
  ctx.beginPath();
  ctx.moveTo(-4*s, 18*s);
  ctx.quadraticCurveTo(-8*s, 35*s, 0, 38*s);
  ctx.quadraticCurveTo(8*s, 35*s, 4*s, 18*s);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.restore();
}

// === DRAW ===
function draw() {
  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#0a0a2e');
  skyGrad.addColorStop(0.5, '#1a1040');
  skyGrad.addColorStop(1, '#0d0d1a');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (const s of stars) {
    ctx.fillStyle = `rgba(255,255,255,${0.5+s.r*0.3})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }

  // Screen shake offset
  let sx = 0, sy = 0;
  if (shakeAmt > 0) {
    sx = (Math.random()-0.5) * shakeAmt * 2;
    sy = (Math.random()-0.5) * shakeAmt * 2;
  }

  ctx.save();
  ctx.translate(sx, sy);

  // Gold pickups
  for (const g of goldPickups) {
    const glow = 0.5 + Math.sin(g.pulse)*0.3;
    // Glow ring
    ctx.fillStyle = `rgba(255,215,0,${glow*0.4})`;
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.radius+6, 0, Math.PI*2);
    ctx.fill();
    // Coin
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.radius, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#DAA520';
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.radius-2, 0, Math.PI*2);
    ctx.fill();
    // Dollar sign
    ctx.fillStyle = '#8B6914';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('$', g.x, g.y+4);
    ctx.textAlign = 'start';
  }

  // Enemies
  for (const e of enemies) {
    // Attack flash
    if (e.flashTimer > 0) {
      ctx.fillStyle = `rgba(255,0,0,${e.flashTimer/8*0.45})`;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius*1.8, 0, Math.PI*2);
      ctx.fill();
    }

    if (e.type === 'drone') {
      // Dark drone/crow
      ctx.fillStyle = '#1a1a2e';
      ctx.strokeStyle = e.flashTimer > 0 ? '#f44' : '#444';
      ctx.lineWidth = e.flashTimer > 0 ? 3 : 1.5;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2);
      ctx.fill();
      ctx.stroke();

      // Red eyes
      ctx.fillStyle = '#FF0000';
      ctx.shadowColor = '#FF0000';
      ctx.shadowBlur = e.flashTimer > 0 ? 12 : 5;
      ctx.beginPath();
      ctx.arc(e.x - 5, e.y - 4, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(e.x + 5, e.y - 4, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      // Boss - bigger, spiky
      ctx.fillStyle = '#330000';
      ctx.strokeStyle = e.flashTimer > 0 ? '#FF4444' : '#880000';
      ctx.lineWidth = e.flashTimer > 0 ? 4 : 2;
      ctx.beginPath();
      // Spiky shape
      for (let a = 0; a < Math.PI*2; a += Math.PI/6) {
        const r = a % (Math.PI/3) < 0.05 ? e.radius*1.4 : e.radius;
        const px = e.x + Math.cos(a)*r;
        const py = e.y + Math.sin(a)*r;
        if (a === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Glowing eyes
      ctx.fillStyle = '#FF4400';
      ctx.shadowColor = '#FF4400';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(e.x - 6, e.y - 5, 5, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(e.x + 6, e.y - 5, 5, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  // Bullets (golden energy blasts)
  for (const b of bullets) {
    const alpha = b.life / 30;
    ctx.fillStyle = `rgba(255,215,0,${alpha})`;
    ctx.shadowColor = '#FFD700';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
    ctx.fill();
    // Inner brighter core
    ctx.fillStyle = `rgba(255,255,200,${alpha})`;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius*0.5, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Player invincibility glow
  if (player.invTimer > 0) {
    const pulseAlpha = 0.12 + 0.08 * Math.sin(player.invTimer * 0.3);
    ctx.fillStyle = `rgba(255,255,0,${pulseAlpha})`;
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.radius + 12, 0, Math.PI*2);
    ctx.fill();
  }

  // Player - Golden Eagle
  drawEagle(player.x, player.y, player.angle, 1);

  // Particles
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.fillStyle = p.color.replace(')', `,${alpha})`).replace('rgb', 'rgba');
    if (p.color.startsWith('#')) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // Flash overlay (damage)
  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(255,0,0,${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Crosshair
  if (gameStarted && !gameOver && !gameWin) {
    ctx.strokeStyle = 'rgba(255,215,0,0.7)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(mouseX, mouseY, 15, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(mouseX-20, mouseY); ctx.lineTo(mouseX-8, mouseY);
    ctx.moveTo(mouseX+8, mouseY); ctx.lineTo(mouseX+20, mouseY);
    ctx.moveTo(mouseX, mouseY-20); ctx.lineTo(mouseX, mouseY-8);
    ctx.moveTo(mouseX, mouseY+8); ctx.lineTo(mouseX, mouseY+20);
    ctx.stroke();
  }
}

// === RESTART ON CLICK ===
canvas.addEventListener('click', () => {
  if (gameOver || gameWin) {
    resetGame();
  }
});

// === LOOP ===
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
