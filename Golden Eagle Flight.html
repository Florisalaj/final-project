<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLDEN EAGLE - Sky Flight</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Arial Black',sans-serif}
canvas{display:block}
#hud{position:absolute;top:10px;left:14px;color:#FFD700;font-size:20px;pointer-events:none;text-shadow:0 0 16px rgba(255,215,0,0.9);line-height:1.7;z-index:10}
#hud span{margin-right:20px}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#FFD700;font-size:30px;text-align:center;pointer-events:none;text-shadow:0 0 50px rgba(255,215,0,0.9);line-height:1.5;white-space:pre-line;z-index:10}
#msg small{font-size:14px;color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">⭐ 0</span><span id="dst">📏 0m</span><span id="bst">💨</span></div>
<div id="msg"></div>

<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function R(){W=C.width=innerWidth;H=C.height=innerHeight}
R();addEventListener('resize',R);

let started=false,gameOver=false;
let eagle={x:150,y:H/2,vy:0,flapPower:0,flapTimer:0};
let obstacles=[],stars=[],particles=[],clouds=[];
let scoreVal=0,distance=0,scrollX=0,speed=3;
let tick=0;

// Generate clouds
for(let i=0;i<15;i++)clouds.push({x:Math.random()*W,y:20+Math.random()*(H-200),w:80+Math.random()*160,h:30+Math.random()*40,sp:0.3+Math.random()*0.6});

function reset(){
  eagle={x:150,y:H/2,vy:0,flapPower:0,flapTimer:0};
  obstacles=[];stars=[];particles=[];
  scoreVal=0;distance=0;scrollX=0;speed=3;tick=0;
  started=false;gameOver=false;
  document.getElementById('msg').innerHTML='🦅 GOLDEN EAGLE 🦅\n<small>SKY FLIGHT</small>\n\n👆 CLICK TO FLAP!\n<small>Flap wings to fly — dodge obstacles!</small>';
}
reset();

function spawnObstacle(){
  const gap=160+Math.random()*120;
  const center=80+Math.random()*(H-160);
  const w=40+Math.random()*40;
  obstacles.push({
    x:W+scrollX+w,y:0,w,h:center-gap/2, // top rock
    x2:W+scrollX+w,y2:center+gap/2,w2:w,h2:H, // bottom rock
    passed:false
  });
}
function spawnStar(){
  stars.push({x:W+scrollX+30,y:50+Math.random()*(H-100),r:10,life:300,pu:Math.random()*Math.PI*2});
}

C.onmousedown=()=>{
  if(!started){started=true;return}
  if(gameOver){reset();return}
  flap();
};
C.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();if(!started){started=true;return}if(gameOver){reset();return}flap()}};
oncontextmenu=e=>e.preventDefault();

function flap(){
  eagle.vy=-9;
  eagle.flapPower=12;
  particlesAt(eagle.x-10,eagle.y+5,8,'#FFD700',4);
}

function particlesAt(x,y,n,c,s){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=s*(0.3+Math.random());
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:10+Math.random()*15,ml:25,c,r:1.5+Math.random()*3});
  }
}

function update(){
  if(!started||gameOver)return;
  tick++;distance=Math.floor(scrollX/8);

  // Speed increases
  speed=3+distance/200;if(speed>10)speed=10;

  // Gravity
  eagle.vy+=0.45;
  eagle.y+=eagle.vy;

  // Flap power decay
  if(eagle.flapPower>0)eagle.flapPower--;
  eagle.flapTimer+=0.3+(eagle.flapPower>0?0.4:0);

  // Scroll
  scrollX+=speed;

  // Check bounds
  if(eagle.y<-20||eagle.y>H+20){
    gameOver=true;
    document.getElementById('msg').innerHTML='💀 CRASHED! 💀\n<small>Score: '+scoreVal+' | Distance: '+distance+'m</small>\n<small>Click to restart</small>';
  }

  // Spawn
  if(tick%70===0)spawnObstacle();
  if(tick%35===0&&Math.random()<0.6)spawnStar();

  // Obstacles
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    const sx=o.x-scrollX+W;
    if(sx<-80){obstacles.splice(i,1);continue}
    // Collision with top rock
    if(eagle.x+20>sx&&eagle.x-20<sx+o.w&&eagle.y-20<o.h){
      gameOver=true;
      document.getElementById('msg').innerHTML='💀 HIT ROCK! 💀\n<small>Score: '+scoreVal+' | Distance: '+distance+'m</small>\n<small>Click to restart</small>';
    }
    // Collision with bottom rock
    if(eagle.x+20>sx&&eagle.x-20<sx+o.w2&&eagle.y+20>o.y2){
      gameOver=true;
      document.getElementById('msg').innerHTML='💀 HIT ROCK! 💀\n<small>Score: '+scoreVal+' | Distance: '+distance+'m</small>\n<small>Click to restart</small>';
    }
    // Passed
    if(!o.passed&&sx+o.w<eagle.x-20){o.passed=true;scoreVal+=10}
  }

  // Stars
  for(let i=stars.length-1;i>=0;i--){
    const s=stars[i];s.x-=speed;s.pu+=0.08;s.life--;
    const sx=s.x-scrollX+W;
    if(sx<-30||s.life<=0){stars.splice(i,1);continue}
    if(Math.hypot(eagle.x-sx,eagle.y-s.y)<30){scoreVal+=5;particlesAt(sx,s.y,12,'#FFD700',5);stars.splice(i,1)}
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx-speed*0.3;p.y+=p.vy;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }

  // Clouds
  for(const cl of clouds){cl.x-=cl.sp;if(cl.x<-cl.w)cl.x=W+Math.random()*100}

  document.getElementById('sc').textContent='⭐ '+scoreVal;
  document.getElementById('dst').textContent='📏 '+distance+'m';
  document.getElementById('bst').textContent='💨 '+speed.toFixed(1)+'x';
}

function drawEagle(x,y,flapTimer,flapPower,vy){
  X.save();X.translate(x,y);
  // Tilt based on velocity
  X.rotate(vy*0.06);

  const s=1.3;
  const flapAngle=Math.sin(flapTimer)*0.7+(flapPower>0?0.3:0);

  X.shadowColor='#FFD700';X.shadowBlur=22;

  // Tail feathers
  X.fillStyle='#8B6914';
  X.beginPath();X.moveTo(-4*s,14*s);X.quadraticCurveTo(-9*s,30*s,0,34*s);X.quadraticCurveTo(9*s,30*s,4*s,14*s);X.closePath();X.fill();

  // Body
  X.fillStyle='#DAA520';
  X.beginPath();X.ellipse(0,0,13*s,20*s,0,0,Math.PI*2);X.fill();
  X.fillStyle='#F0C75E';
  X.beginPath();X.ellipse(0,3*s,8*s,14*s,0,0,Math.PI*2);X.fill();

  // === LEFT WING FLAPPING ===
  X.save();X.translate(-7*s,-2*s);
  X.rotate(-0.4+flapAngle);
  X.fillStyle='#B8860B';
  X.beginPath();X.moveTo(0,0);X.quadraticCurveTo(-35*s,-18*s,-42*s,2*s);X.quadraticCurveTo(-28*s,12*s,0,6*s);X.closePath();X.fill();
  X.strokeStyle='#8B6914';X.lineWidth=2;X.stroke();
  // Wing feather details
  X.strokeStyle='rgba(0,0,0,0.25)';X.lineWidth=1;
  X.beginPath();X.moveTo(-5*s,2*s);X.lineTo(-30*s,-6*s);X.stroke();
  X.beginPath();X.moveTo(-5*s,4*s);X.lineTo(-28*s,2*s);X.stroke();
  X.restore();

  // === RIGHT WING FLAPPING ===
  X.save();X.translate(7*s,-2*s);
  X.rotate(0.4-flapAngle);
  X.fillStyle='#B8860B';
  X.beginPath();X.moveTo(0,0);X.quadraticCurveTo(35*s,-18*s,42*s,2*s);X.quadraticCurveTo(28*s,12*s,0,6*s);X.closePath();X.fill();
  X.strokeStyle='#8B6914';X.lineWidth=2;X.stroke();
  X.strokeStyle='rgba(0,0,0,0.25)';X.lineWidth=1;
  X.beginPath();X.moveTo(5*s,2*s);X.lineTo(30*s,-6*s);X.stroke();
  X.beginPath();X.moveTo(5*s,4*s);X.lineTo(28*s,2*s);X.stroke();
  X.restore();

  // Head
  X.fillStyle='#1a1a1a';X.beginPath();X.arc(0,-20*s,11*s,0,Math.PI*2);X.fill();
  X.fillStyle='#FFF';X.beginPath();X.arc(0,-22*s,8*s,Math.PI,0);X.fill();

  // Crest feathers
  X.fillStyle='#FFD700';
  X.beginPath();X.moveTo(-3*s,-22*s);X.quadraticCurveTo(-2*s,-32*s,0,-34*s);X.quadraticCurveTo(2*s,-32*s,3*s,-22*s);X.closePath();X.fill();

  // Eyes - GLOWING
  X.fillStyle='#FFD700';X.shadowColor='#FF0000';X.shadowBlur=12;
  X.beginPath();X.arc(-4*s,-21*s,3.5*s,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(4*s,-21*s,3.5*s,0,Math.PI*2);X.fill();
  X.fillStyle='#000';X.shadowBlur=0;
  X.beginPath();X.arc(-4*s,-21*s,1.8*s,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(4*s,-21*s,1.8*s,0,Math.PI*2);X.fill();

  // Beak
  X.fillStyle='#FF8C00';
  X.beginPath();X.moveTo(-2.5*s,-16*s);X.lineTo(0,-9*s);X.lineTo(2.5*s,-16*s);X.closePath();X.fill();
  X.fillStyle='#FFD700';
  X.beginPath();X.moveTo(-2.5*s,-16*s);X.lineTo(0,-13*s);X.lineTo(2.5*s,-16*s);X.closePath();X.fill();

  // Talons tucked
  X.strokeStyle='#FF8C00';X.lineWidth=2;
  X.beginPath();X.moveTo(-5*s,18*s);X.lineTo(-9*s,24*s);X.stroke();
  X.beginPath();X.moveTo(5*s,18*s);X.lineTo(9*s,24*s);X.stroke();

  // Flap burst particles
  if(flapPower>8){
    X.fillStyle='rgba(255,215,0,0.55)';
    X.beginPath();X.arc(0,10*s,flapPower*2,0,Math.PI*2);X.fill();
  }

  X.shadowBlur=0;X.restore();
}

function draw(){
  // Beautiful sky gradient
  const sky=X.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a3a7e');sky.addColorStop(0.3,'#3a7ec8');sky.addColorStop(0.7,'#6ab8e8');sky.addColorStop(1,'#aad4f0');
  X.fillStyle=sky;X.fillRect(0,0,W,H);

  // Sun
  X.fillStyle='rgba(255,240,180,0.4)';X.beginPath();X.arc(W-100,80,70,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(255,255,220,0.7)';X.beginPath();X.arc(W-100,80,35,0,Math.PI*2);X.fill();

  // Clouds
  for(const cl of clouds){
    const sx=cl.x-scrollX*0.3;const cx=((sx%((W+cl.w)*2))+((W+cl.w)*2))%((W+cl.w)*2)-cl.w;
    X.fillStyle='rgba(255,255,255,0.8)';
    X.beginPath();X.ellipse(cx,cl.y,cl.w/2,cl.h/2,0,0,Math.PI*2);X.fill();
    X.beginPath();X.ellipse(cx-cl.w*0.25,cl.y+cl.h*0.15,cl.w*0.35,cl.h*0.4,0,0,Math.PI*2);X.fill();
    X.beginPath();X.ellipse(cx+cl.w*0.25,cl.y+cl.h*0.1,cl.w*0.35,cl.h*0.4,0,0,Math.PI*2);X.fill();
  }

  // Obstacles (rock pillars)
  for(const o of obstacles){
    const sx=o.x-scrollX+W;
    if(sx<-80||sx>W+80)continue;
    // Top rock
    const rockGrad=X.createLinearGradient(sx,0,sx+o.w,0);
    rockGrad.addColorStop(0,'#666');rockGrad.addColorStop(0.5,'#888');rockGrad.addColorStop(1,'#555');
    X.fillStyle=rockGrad;X.fillRect(sx,0,o.w,o.h);
    X.strokeStyle='#444';X.lineWidth=3;X.strokeRect(sx,0,o.w,o.h);
    // Bottom rock
    X.fillStyle=rockGrad;X.fillRect(sx,o.y2,o.w2,o.h2);
    X.strokeStyle='#444';X.lineWidth=3;X.strokeRect(sx,o.y2,o.w2,o.h2);
  }

  // Stars (collectibles)
  for(const s of stars){
    const sx=s.x-scrollX+W;
    if(sx<-30||sx>W+30)continue;
    const gl=0.5+Math.sin(s.pu)*0.4;
    X.fillStyle=`rgba(255,215,0,${gl*0.3})`;
    X.beginPath();X.arc(sx,s.y,s.r+6,0,Math.PI*2);X.fill();
    X.fillStyle='#FFD700';X.beginPath();X.arc(sx,s.y,s.r,0,Math.PI*2);X.fill();
    // Star shape
    X.fillStyle='#FFF';
    const cx2=sx,cy2=s.y;
    X.font='18px Arial';X.textAlign='center';
    X.fillText('⭐',cx2,cy2+6);
    X.textAlign='start';
  }

  // Particles
  for(const p of particles){
    const sx=p.x-scrollX+W,al=p.life/p.ml;
    X.globalAlpha=al;X.fillStyle=p.c;
    X.beginPath();X.arc(sx,p.y,p.r,0,Math.PI*2);X.fill();
  }
  X.globalAlpha=1;

  // THE EAGLE
  drawEagle(eagle.x,eagle.y,eagle.flapTimer,eagle.flapPower,eagle.vy);

  // Ground hint
  X.fillStyle='rgba(100,160,80,0.3)';X.fillRect(0,H-5,W,5);
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
