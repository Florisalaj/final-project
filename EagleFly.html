<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🦅 EAGLE FLY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#5cf;height:100vh;overflow:hidden;font-family:Arial Black;user-select:none}
#e{position:absolute;font-size:80px;left:100px;z-index:5}
#s{position:absolute;top:12px;left:16px;background:rgba(255,255,255,0.85);padding:6px 14px;border-radius:8px;font-size:18px;z-index:20}
#m{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:16px 26px;border-radius:12px;font-size:24px;text-align:center;z-index:20;box-shadow:0 6px 25px rgba(0,0,0,0.25);white-space:pre-line}
.r{position:absolute;width:50px;background:#999;border:3px solid #666;border-radius:3px;z-index:3}
.t{position:absolute;font-size:36px;z-index:2}
</style>
</head>
<body>
<div id="e">🦅</div>
<div id="s">⭐ 0 &nbsp; 📏 0m</div>
<div id="m">🦅 GOLDEN EAGLE 🦅<br><span style="font-size:15px;color:#555">CLICK OR SPACE = FLAP UP</span><br><span style="font-size:13px;color:#888">KEEP CLICKING TO STAY IN THE AIR!</span></div>
<script>
const E=document.getElementById('e'),M=document.getElementById('m'),S=document.getElementById('s');
let y=innerHeight/2-40,v=0,sc=0,ds=0,sx=0,tk=0,st=false,dead=false;
let rocks=[],stars=[];
E.style.top=y+'px';

function flap(){
  v=-10;E.style.transform='rotate(-25deg)';
  setTimeout(()=>E.style.transform='rotate(3deg)',100);
}
onclick=()=>{
  if(!st){st=true;M.style.display='none';flap();return}
  if(dead){location.reload();return}
  flap();
};
onkeydown=e=>{if(e.code==='Space'){e.preventDefault();if(!st){st=true;M.style.display='none';flap();return}if(dead){location.reload()}flap()}};

function addRock(){
  const g=200,cy=100+Math.random()*(innerHeight-200),r=document.createElement('div');r.className='r';
  r.style.left=innerWidth+'px';r.style.top='0px';r.style.height=(cy-g/2)+'px';r.cy=cy;r.g=g;
  document.body.appendChild(r);rocks.push(r);
  const r2=document.createElement('div');r2.className='r';r2.style.left=innerWidth+'px';
  r2.style.top=(cy+g/2)+'px';r2.style.height=innerHeight+'px';
  document.body.appendChild(r2);rocks.push(r2);
}
function addStar(){
  const s=document.createElement('div');s.className='t';s.textContent='⭐';
  s.style.left=innerWidth+'px';s.style.top=(70+Math.random()*(innerHeight-140))+'px';
  document.body.appendChild(s);stars.push(s);
}
setInterval(()=>{
  if(!st||dead)return;
  tk++;ds=Math.floor(sx/8);
  // Lighter gravity
  v+=0.4;y+=v;E.style.top=y+'px';
  if(y<-100||y>innerHeight+100){dead=true;M.style.display='block';M.innerHTML='💀 CRASHED!<br><span style="font-size:15px;color:#555">Score: '+sc+' | '+ds+'m</span><br><span style="font-size:14px">Click to retry</span>'}
  sx+=3.5+ds/200;
  if(tk%55===0)addRock();
  if(tk%35===0&&Math.random()<0.4)addStar();
  for(let i=rocks.length-1;i>=0;i--){
    const r=rocks[i];let l=parseFloat(r.style.left)-4;r.style.left=l+'px';
    if(l<-80){r.remove();rocks.splice(i,1);continue}
    if(r.cy&&!r.p&&l<100){r.p=true;sc+=5}
    if(r.cy&&l<180&&l+50>100){const th=r.cy-r.g/2,by=r.cy+r.g/2;if(y<th||y+60>by){dead=true;M.style.display='block';M.innerHTML='💀 HIT ROCK!<br><span style="font-size:15px;color:#555">Score: '+sc+' | '+ds+'m</span><br><span style="font-size:14px">Click to retry</span>'}}
  }
  for(let i=stars.length-1;i>=0;i--){
    const s=stars[i];let l=parseFloat(s.style.left)-4;s.style.left=l+'px';
    if(l<-40){s.remove();stars.splice(i,1);continue}
    if(l<160&&l>90&&Math.abs(y+30-parseFloat(s.style.top))<55){sc+=3;s.remove();stars.splice(i,1)}
  }
  S.textContent='⭐ '+sc+'  📏 '+ds+'m';
},16);
</script>
</body>
</html>
