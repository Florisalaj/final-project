<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLDEN EAGLE - Rage of the Sky</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;cursor:none;font-family:'Arial Black',sans-serif}
canvas{display:block}
#hud{position:absolute;top:8px;left:12px;color:#FFD700;font-size:15px;pointer-events:none;text-shadow:0 0 12px rgba(255,215,0,0.7);line-height:1.6}
#hud span{margin-right:18px}
#bigmsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#FFD700;font-size:38px;text-align:center;pointer-events:none;text-shadow:0 0 40px rgba(255,215,0,0.9),0 0 80px rgba(255,150,0,0.5);line-height:1.4;white-space:pre-line}
#bigmsg small{font-size:16px;color:#fff;text-shadow:0 0 10px #fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="s">💰 0</span><span id="h">❤️ 8</span><span id="k">💀 0</span><span id="wav">🌊 1</span><span id="pow">⚡</span></div>
<div id="bigmsg"></div>

<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function R(){W=C.width=innerWidth;H=C.height=innerHeight}
R();addEventListener('resize',R);

const K={},M={x:W/2,y:H/2};
let md=false,started=false;

onkeydown=e=>{K[e.key.toLowerCase()]=true;e.preventDefault()}
onkeyup=e=>{K[e.key.toLowerCase()]=false}
C.onmousemove=e=>{M.x=e.clientX;M.y=e.clientY}
C.onmousedown=()=>{if(!started){started=true;return}md=true}
C.onmouseup=()=>md=false
oncontextmenu=e=>e.preventDefault()

// === PLAYER ===
const P={
  x:W/2,y:H/2,r:20,s:13,
  hp:8,mhp:8,
  cd:0,
  inv:0,
  a:0,
  dmg:1,spd:4,spray:1 // powerups
};

let B=[],E=[],Q=[],G=[],SC=0,KL=0,WV=1,GO=false,GW=false;
let st=0,el=0,wt=0,sha=0,fl=0,bs=0;
let powTimer=0,powType='';

// Stars
const ST=[];
for(let i=0;i<200;i++)ST.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+0.3,v:Math.random()*0.4+0.1});

// === AUDIO (simple oscillator beeps) ===
let AC=null;
function beep(f,d,t){try{if(!AC)AC=new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=0.06;g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

function SW(){
  WV++;el=4+WV*4;st=0;wt=70;
  if(WV%5===0){el+=3;bs=1} // boss wave
  document.getElementById('bigmsg').innerHTML='⚡ WAVE '+WV+' ⚡'+(WV%5===0?'<br><small>⚠ BOSS INCOMING ⚠</small>':'');
  beep(600,0.15);beep(900,0.2);
}

function SE(){
  const side=Math.floor(Math.random()*4);
  let ex,ey;
  if(side===0){ex=Math.random()*W;ey=-50}
  else if(side===1){ex=W+50;ey=Math.random()*H}
  else if(side===2){ex=Math.random()*W;ey=H+50}
  else{ex=-50;ey=Math.random()*H}
  const sm=1+(WV-1)*0.3;
  const bs=3*s;
  const t=bs&&Math.random()<0.35?'boss':'drone';
  const r=t==='boss'?28+Math.random()*18:16+Math.random()*12;
  E.push({x:ex,y:ey,r,s:bs*(0.6+Math.random()*0.6),hp:t==='boss'?3+Math.floor(WV/2):1+Math.floor(WV/4),mhp:0,ft:0,ac:0,ty:t});
  if(t==='boss'){const e=E[E.length-1];e.mhp=e.hp;e.s*=0.7}
  el--;
}

function RS(){
  P.x=W/2;P.y=H/2;P.hp=P.mhp;P.cd=0;P.inv=90;P.a=0;P.dmg=1;P.spd=4;P.spray=1;
  B=[];E=[];Q=[];G=[];SC=0;KL=0;WV=0;GO=false;GW=false;st=0;el=0;wt=0;sha=0;fl=0;bs=0;powTimer=0;powType='';
  started=false;
  document.getElementById('bigmsg').innerHTML='🦅 GOLDEN EAGLE 🦅\n<small>RAGE OF THE SKY</small>\n\n👆 CLICK TO START!';
  document.getElementById('pow').textContent='⚡';
  SW();
}

SW();
document.getElementById('bigmsg').innerHTML='🦅 GOLDEN EAGLE 🦅\n<small>RAGE OF THE SKY</small>\n\n👆 CLICK TO START!';

// === PARTICLES ===
function SP(x,y,n,c,s){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=s*(0.4+Math.random());
    Q.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:18+Math.random()*20,ml:38,c,r:1.5+Math.random()*3.5});
  }
}

// === POWERUP DROP ===
function dropPower(x,y){
  const types=['dmg','spd','spray','heal'];
  const t=types[Math.floor(Math.random()*4)];
  G.push({x,y,r:10,life:360,pu:0,ty:t});
}

// === UPDATE ===
function UP(){
  if(!started)return;
  if(GO||GW){st=0;return}

  if(wt>0)wt--;
  if(wt===1)document.getElementById('bigmsg').innerHTML='';

  if(P.inv>0)P.inv--;
  if(P.cd>0)P.cd--;
  if(powTimer>0){powTimer--;if(powTimer===0){P.dmg=1;P.spd=4;P.spray=1;powType='';document.getElementById('pow').textContent='⚡'}}
  sha*=0.84;if(sha<0.08)sha=0;
  fl*=0.86;if(fl<0.008)fl=0;

  // Movement
  let mx=0,my=0;
  if(K.w||K.arrowup)my=-1;
  if(K.s||K.arrowdown)my=1;
  if(K.a||K.arrowleft)mx=-1;
  if(K.d||K.arrowright)mx=1;
  if(mx||my){const l=Math.hypot(mx,my);mx/=l;my/=l}
  P.x+=mx*P.s;
  P.y+=my*P.s;
  P.x=Math.max(P.r,Math.min(W-P.r,P.x));
  P.y=Math.max(P.r,Math.min(H-P.r,P.y));
  P.a=Math.atan2(M.y-P.y,M.x-P.x);

  // Shoot
  if(md&&P.cd<=0){
    P.cd=2;
    const a=P.a;
    for(let i=0;i<P.spray;i++){
      const spread=(i-(P.spray-1)/2)*0.12;
      B.push({x:P.x+Math.cos(a)*22,y:P.y+Math.sin(a)*22,vx:Math.cos(a+spread)*55,vy:Math.sin(a+spread)*55,life:28,r:5,d:P.dmg});
    }
    SP(P.x+Math.cos(a)*22,P.y+Math.sin(a)*22,4,'#FFD700',5);
    beep(200+Math.random()*100,0.05,'square');
  }

  // Bullets
  for(let i=B.length-1;i>=0;i--){
    const b=B[i];b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0||b.x<-60||b.x>W+60||b.y<-60||b.y>H+60)B.splice(i,1);
  }

  // Powerups
  for(let i=G.length-1;i>=0;i--){
    const g=G[i];g.life--;g.pu+=0.08;
    if(g.life<=0){G.splice(i,1);continue}
    if(Math.hypot(P.x-g.x,P.y-g.y)<P.r+g.r+14){
      if(g.ty==='dmg'){P.dmg=3;powType='2X DAMAGE';beep(800,0.2,'triangle')}
      else if(g.ty==='spd'){P.s=10;powType='SPEED BOOST';beep(1000,0.2,'triangle')}
      else if(g.ty==='spray'){P.spray=3;powType='TRIPLE SHOT';beep(1200,0.2,'triangle')}
      else if(g.ty==='heal'){P.hp=Math.min(P.mhp,P.hp+3);powType='HEAL';beep(400,0.3,'sine')}
      powTimer=300;
      document.getElementById('pow').textContent='⚡ '+powType;
      SP(g.x,g.y,15,'#FFD700',5);
      G.splice(i,1);
    }else if(Math.hypot(P.x-g.x,P.y-g.y)<180){
      const a=Math.atan2(P.y-g.y,P.x-g.x);
      g.x+=Math.cos(a)*5;g.y+=Math.sin(a)*5;
    }
  }

  // Spawn
  if(el>0){st--;if(st<=0){SE();st=Math.max(4,22-WV*2)}}
  if(el<=0&&E.length===0&&!GO){
    if(WV>=15){GW=true;document.getElementById('bigmsg').innerHTML='👑 YOU WIN! 👑<br><small>Score: '+SC+' | Kills: '+KL+'</small><br><small>Click to restart</small>';beep(500,0.3);beep(700,0.3);beep(1000,0.5)}
    else SW();
  }

  // Enemies
  for(let i=E.length-1;i>=0;i--){
    const e=E[i];
    const dx=P.x-e.x,dy=P.y-e.y,dist=Math.hypot(dx,dy);
    if(dist>0){e.x+=(dx/dist)*e.s;e.y+=(dy/dist)*e.s}
    if(e.ft>0)e.ft--;
    if(e.ac>0)e.ac--;

    if(dist<P.r+e.r+8&&e.ac<=0&&P.inv<=0){
      e.ac=16;e.ft=8;
      P.hp--;sha=12;fl=0.5;
      SP(P.x,P.y,25,'#FF0000',6);
      beep(80,0.15,'sawtooth');
      if(P.hp<=0){GO=true;document.getElementById('bigmsg').innerHTML='💀 GAME OVER 💀<br><small>Score: '+SC+' | Wave: '+WV+' | Kills: '+KL+'</small><br><small>Click to restart</small>'}
    }

    for(let j=B.length-1;j>=0;j--){
      const b=B[j];
      if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+b.r){
        e.hp-=b.d;SP(b.x,b.y,7,'#FFD700',5);B.splice(j,1);
        if(e.hp<=0){
          SP(e.x,e.y,30,e.ty==='boss'?'#FF4400':'#FFD700',8);
          SC+=e.ty==='boss'?800:150;KL++;
          if(e.ty==='boss'){bs--;dropPower(e.x,e.y);for(let k=0;k<3;k++)dropPower(e.x+Math.random()*60-30,e.y+Math.random()*60-30)}
          else if(Math.random()<0.25)dropPower(e.x,e.y);
          E.splice(i,1);beep(300,0.1,'square');
          break;
        }else{e.ft=5}
      }
    }
  }

  // Particles
  for(let i=Q.length-1;i>=0;i--){
    const p=Q[i];p.x+=p.vx;p.y+=p.vy;p.life--;
    if(p.life<=0)Q.splice(i,1);
  }

  // Stars
  for(const s of ST){s.y+=s.v;if(s.y>H+5){s.y=-5;s.x=Math.random()*W}}

  document.getElementById('s').textContent='💰 '+SC;
  document.getElementById('h').textContent='❤️ '+P.hp;
  document.getElementById('k').textContent='💀 '+KL;
  document.getElementById('wav').textContent='🌊 '+WV;
}

// === DRAW EAGLE ===
function DE(x,y,a,s){
  X.save();X.translate(x,y);X.rotate(a);const z=s||1;
  X.shadowColor='#FFD700';X.shadowBlur=20;

  // Tail
  X.fillStyle='#8B6914';
  X.beginPath();X.moveTo(-5*z,18*z);X.quadraticCurveTo(-10*z,38*z,0,42*z);X.quadraticCurveTo(10*z,38*z,5*z,18*z);X.closePath();X.fill();

  // Body
  X.fillStyle='#DAA520';X.beginPath();X.ellipse(0,0,15*z,24*z,0,0,Math.PI*2);X.fill();
  X.fillStyle='#F0C75E';X.beginPath();X.ellipse(0,5*z,10*z,16*z,0,0,Math.PI*2);X.fill();

  // Wings
  X.fillStyle='#B8860B';
  X.beginPath();X.moveTo(-6*z,-10*z);X.quadraticCurveTo(-42*z,-22*z,-48*z,0);X.quadraticCurveTo(-34*z,10*z,-8*z,6*z);X.closePath();X.fill();
  X.strokeStyle='#8B6914';X.lineWidth=2;X.stroke();
  X.beginPath();X.moveTo(6*z,-10*z);X.quadraticCurveTo(42*z,-22*z,48*z,0);X.quadraticCurveTo(34*z,10*z,8*z,6*z);X.closePath();X.fill();
  X.stroke();

  // Wing highlights
  X.fillStyle='#DAA520';
  X.beginPath();X.moveTo(-6*z,-6*z);X.quadraticCurveTo(-28*z,-14*z,-30*z,0);X.quadraticCurveTo(-22*z,6*z,-8*z,4*z);X.closePath();X.fill();
  X.beginPath();X.moveTo(6*z,-6*z);X.quadraticCurveTo(28*z,-14*z,30*z,0);X.quadraticCurveTo(22*z,6*z,8*z,4*z);X.closePath();X.fill();

  // Head
  X.fillStyle='#1a1a1a';X.beginPath();X.arc(0,-22*z,13*z,0,Math.PI*2);X.fill();
  X.fillStyle='#FFF';X.beginPath();X.arc(0,-25*z,10*z,Math.PI,0);X.fill();

  // Eyes
  X.shadowColor='#FF0000';X.shadowBlur=10;
  X.fillStyle='#FFD700';X.beginPath();X.arc(-5*z,-23*z,4*z,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(5*z,-23*z,4*z,0,Math.PI*2);X.fill();
  X.fillStyle='#000';X.beginPath();X.arc(-5*z,-23*z,2*z,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(5*z,-23*z,2*z,0,Math.PI*2);X.fill();

  // Beak
  X.shadowColor='transparent';X.shadowBlur=0;
  X.fillStyle='#FF8C00';X.beginPath();X.moveTo(-4*z,-18*z);X.lineTo(0,-10*z);X.lineTo(4*z,-18*z);X.closePath();X.fill();
  X.fillStyle='#FFD700';X.beginPath();X.moveTo(-4*z,-18*z);X.lineTo(0,-14*z);X.lineTo(4*z,-18*z);X.closePath();X.fill();

  // Talons
  X.strokeStyle='#FF8C00';X.lineWidth=2.5;
  X.beginPath();X.moveTo(-7*z,22*z);X.lineTo(-12*z,32*z);X.moveTo(-7*z,26*z);X.lineTo(-2*z,33*z);X.stroke();
  X.beginPath();X.moveTo(7*z,22*z);X.lineTo(12*z,32*z);X.moveTo(7*z,26*z);X.lineTo(2*z,33*z);X.stroke();

  // Crown/crest
  X.fillStyle='#FFD700';
  for(let i=-2;i<=2;i++){
    X.beginPath();X.moveTo(i*6*z,-24*z);X.lineTo(i*6*z-3*z,-34*z);X.lineTo(i*6*z+3*z,-34*z);X.closePath();X.fill();
  }

  X.shadowBlur=0;X.restore();
}

// === DRAW ===
function DR(){
  const g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#050520');g.addColorStop(0.4,'#0d0d35');g.addColorStop(1,'#0a0a18');
  X.fillStyle=g;X.fillRect(0,0,W,H);

  for(const s of ST){
    X.fillStyle=`rgba(255,255,255,${0.3+s.r*0.3})`;
    X.beginPath();X.arc(s.x,s.y,s.r,0,Math.PI*2);X.fill();
  }

  let sx=0,sy=0;
  if(sha>0){sx=(Math.random()-0.5)*sha*3;sy=(Math.random()-0.5)*sha*3}
  X.save();X.translate(sx,sy);

  // Powerups
  for(const g of G){
    const gl=0.5+Math.sin(g.pu)*0.4;
    X.fillStyle=`rgba(255,215,0,${gl*0.3})`;
    X.beginPath();X.arc(g.x,g.y,g.r+8,0,Math.PI*2);X.fill();
    const c=g.ty==='heal'?'#FF4444':g.ty==='dmg'?'#FF6600':g.ty==='spd'?'#44FF44':'#4488FF';
    X.fillStyle=c;X.beginPath();X.arc(g.x,g.y,g.r,0,Math.PI*2);X.fill();
    X.fillStyle='#FFF';X.font='bold 11px Arial';X.textAlign='center';
    const label=g.ty==='heal'?'+':g.ty==='dmg'?'2X':g.ty==='spd'?'>>':g.ty==='spray'?'3WAY':'?';
    X.fillText(label,g.x,g.y+4);
    X.textAlign='start';
  }

  // Enemies
  for(const e of E){
    if(e.ft>0){
      X.fillStyle=`rgba(255,0,0,${e.ft/8*0.5})`;
      X.beginPath();X.arc(e.x,e.y,e.r*2,0,Math.PI*2);X.fill();
    }
    if(e.ty==='drone'){
      X.fillStyle='#1a1a30';X.strokeStyle=e.ft>0?'#f44':'#555';X.lineWidth=e.ft>0?3:1.5;
      X.beginPath();X.arc(e.x,e.y,e.r,0,Math.PI*2);X.fill();X.stroke();
      X.fillStyle='#FF0000';X.shadowColor='#FF0000';X.shadowBlur=e.ft>0?14:6;
      X.beginPath();X.arc(e.x-5,e.y-5,4.5,0,Math.PI*2);X.fill();
      X.beginPath();X.arc(e.x+5,e.y-5,4.5,0,Math.PI*2);X.fill();
      X.shadowBlur=0;
    }else{
      X.fillStyle='#2a0000';X.strokeStyle=e.ft>0?'#FF4444':'#990000';X.lineWidth=e.ft>0?4:2.5;
      X.beginPath();
      for(let a=0;a<Math.PI*2;a+=Math.PI/7){
        const r2=a%(Math.PI/3.5)<0.06?e.r*1.5:e.r;
        const px=e.x+Math.cos(a)*r2,py=e.y+Math.sin(a)*r2;
        a===0?X.moveTo(px,py):X.lineTo(px,py);
      }
      X.closePath();X.fill();X.stroke();
      // HP bar
      if(e.mhp>1){
        X.fillStyle='#333';X.fillRect(e.x-20,e.y-e.r-10,40,5);
        X.fillStyle='#FF4444';X.fillRect(e.x-20,e.y-e.r-10,40*(e.hp/e.mhp),5);
      }
      X.fillStyle='#FF4400';X.shadowColor='#FF4400';X.shadowBlur=18;
      X.beginPath();X.arc(e.x-7,e.y-6,6,0,Math.PI*2);X.fill();
      X.beginPath();X.arc(e.x+7,e.y-6,6,0,Math.PI*2);X.fill();
      X.shadowBlur=0;
    }
  }

  // Bullets
  for(const b of B){
    const al=b.life/28;
    X.fillStyle=`rgba(255,215,0,${al})`;X.shadowColor='#FFD700';X.shadowBlur=12;
    X.beginPath();X.arc(b.x,b.y,b.r,0,Math.PI*2);X.fill();
    X.fillStyle=`rgba(255,255,220,${al})`;X.beginPath();X.arc(b.x,b.y,b.r*0.4,0,Math.PI*2);X.fill();
    X.shadowBlur=0;
  }

  // Invincibility
  if(P.inv>0){
    const pa=0.12+0.1*Math.sin(P.inv*0.3);
    X.fillStyle=`rgba(255,255,0,${pa})`;
    X.beginPath();X.arc(P.x,P.y,P.r+14,0,Math.PI*2);X.fill();
  }

  // Player
  DE(P.x,P.y,P.a,1);

  // Particles
  for(const p of Q){
    const al=p.life/p.ml;
    X.globalAlpha=al;X.fillStyle=p.c;
    X.beginPath();X.arc(p.x,p.y,p.r,0,Math.PI*2);X.fill();
  }
  X.globalAlpha=1;
  X.restore();

  if(fl>0){X.fillStyle=`rgba(255,0,0,${fl})`;X.fillRect(0,0,W,H)}

  // Crosshair
  if(started&&!GO&&!GW){
    X.strokeStyle='rgba(255,215,0,0.8)';X.lineWidth=2;
    X.beginPath();X.arc(M.x,M.y,14,0,Math.PI*2);X.stroke();
    X.beginPath();
    X.moveTo(M.x-22,M.y);X.lineTo(M.x-9,M.y);X.moveTo(M.x+9,M.y);X.lineTo(M.x+22,M.y);
    X.moveTo(M.x,M.y-22);X.lineTo(M.x,M.y-9);X.moveTo(M.x,M.y+9);X.lineTo(M.x,M.y+22);
    X.stroke();
  }

  // Power timer bar
  if(powTimer>0){
    X.fillStyle='#333';X.fillRect(W-210,12,200,8);
    X.fillStyle='#FFD700';X.fillRect(W-210,12,200*(powTimer/300),8);
    X.fillStyle='#FFD700';X.font='10px Arial Black';X.textAlign='right';
    X.fillText(powType+' '+(powTimer/60).toFixed(1)+'s',W-14,10);
    X.textAlign='start';
  }
}

C.addEventListener('click',()=>{if(GO||GW)RS()});

function loop(){UP();DR();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
