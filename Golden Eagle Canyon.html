<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOLDEN EAGLE - Canyon Rush</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;cursor:none;font-family:'Arial Black',sans-serif}
canvas{display:block}
#hud{position:absolute;top:10px;left:14px;color:#FFD700;font-size:16px;pointer-events:none;text-shadow:0 0 14px rgba(255,215,0,0.7);line-height:1.7}
#hud span{margin-right:18px}
#bigmsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#FFD700;font-size:36px;text-align:center;pointer-events:none;text-shadow:0 0 40px rgba(255,215,0,0.9);line-height:1.4;white-space:pre-line}
#bigmsg small{font-size:15px;color:#ffa}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">🦅 0m</span><span id="hp">❤️ 3</span><span id="co">🪙 0</span><span id="sp">💨 x1</span></div>
<div id="bigmsg"></div>

<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H;
function R(){W=C.width=innerWidth;H=C.height=innerHeight}
R();addEventListener('resize',R);

const K={};let md=false,started=false;
onkeydown=e=>{K[e.key.toLowerCase()]=true;e.preventDefault()}
onkeyup=e=>{K[e.key.toLowerCase()]=false}
C.onmousedown=()=>{if(!started){started=true;return}md=true}
C.onmouseup=()=>md=false
oncontextmenu=e=>e.preventDefault()

// === PLAYER ===
const P={x:120,y:H/2,r:18,vy:0,speed:0,boost:0,inv:0,hp:3,mhp:3,flap:0};

// === WORLD ===
let scrollX=0,distance=0,coins=0;
let rocks=[],trees=[],pickups=[],particles=[];
let speedBase=4,speedNow=4;
let GO=false,shakeA=0,flashA=0;
let rockTimer=0,treeTimer=0,coinTimer=0;
let difficulty=1;

// Sky gradient layers
const clouds=[],mountains=[];
for(let i=0;i<12;i++)clouds.push({x:Math.random()*W,y:30+Math.random()*120,w:60+Math.random()*160,h:20+Math.random()*30,sp:0.3+Math.random()*0.5});
for(let i=0;i<8;i++)mountains.push({x:i*250+Math.random()*100,y:H-80-Math.random()*120,w:180+Math.random()*250,h:100+Math.random()*180});

function RS(){
  P.x=120;P.y=H/2;P.vy=0;P.speed=0;P.boost=0;P.inv=90;P.hp=P.mhp;P.flap=0;
  scrollX=0;distance=0;coins=0;rocks=[];trees=[];pickups=[];particles=[];
  speedBase=4;speedNow=4;GO=false;shakeA=0;flashA=0;rockTimer=0;treeTimer=0;coinTimer=0;difficulty=1;
  started=false;
  document.getElementById('bigmsg').innerHTML='🦅 GOLDEN EAGLE 🦅\n<small>CANYON RUSH</small>\n\n👆 CLICK TO FLY!\n<small>W/↑ = fly up | S/↓ = dive | CLICK = BOOST</small>';
}
RS();
document.getElementById('bigmsg').innerHTML='🦅 GOLDEN EAGLE 🦅\n<small>CANYON RUSH</small>\n\n👆 CLICK TO FLY!\n<small>W/↑ = fly up | S/↓ = dive | CLICK = BOOST</small>';

function SP(x,y,n,c,s){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=s*(0.3+Math.random());particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:12+Math.random()*18,ml:30,c,r:1+Math.random()*3})}
}

function spawnRock(){
  const r=18+Math.random()*35;
  rocks.push({x:W+scrollX+r,y:Math.random()*(H-100)+50,r,sp:Math.random()*0.5+0.3});
}
function spawnTree(){
  trees.push({x:W+scrollX+40,y:H-30,trunkW:12+Math.random()*20,trunkH:60+Math.random()*80,canopyR:25+Math.random()*30});
}
function spawnCoin(){
  pickups.push({x:W+scrollX+30,y:40+Math.random()*(H-100),r:10,life:400,pu:Math.random()*Math.PI*2});
}

// === UPDATE ===
function UP(){
  if(!started)return;
  if(GO){return}

  if(P.inv>0)P.inv--;
  if(P.boost>0)P.boost--;
  shakeA*=0.84;if(shakeA<0.06)shakeA=0;
  flashA*=0.86;if(flashA<0.008)flashA=0;

  // Difficulty ramps
  difficulty=1+Math.floor(distance/300);
  speedBase=4+difficulty*0.6;
  if(speedBase>18)speedBase=18;

  // Boost
  let boosting=false;
  if(md&&P.boost<=0){P.boost=25;boosting=true;SP(P.x+20,P.y,8,'#FFD700',6)}
  if(P.boost>0){speedNow=speedBase*2.2;boosting=true}else{speedNow=speedBase}

  // Flight controls
  const up=K.w||K.arrowup;
  const down=K.s||K.arrowdown;
  const grav=0.35;
  let lift=0;
  if(up)lift=-0.8;
  if(down)lift=0.5;

  P.vy+=grav+lift;
  P.vy*=0.94;
  P.vy=Math.max(-10,Math.min(10,P.vy));
  P.y+=P.vy;
  P.y=Math.max(P.r+5,Math.min(H-35,P.y));

  // Flap animation
  if(up||boosting){P.flap+=0.5}else{P.flap*=0.9}

  // Scroll
  scrollX+=speedNow;
  distance=Math.floor(scrollX/10);

  // Player world X stays at 120, world scrolls

  // === OBSTACLES ===
  rockTimer--;
  if(rockTimer<=0){spawnRock();rockTimer=Math.max(20,60-difficulty*3)}
  treeTimer--;
  if(treeTimer<=0){spawnTree();treeTimer=Math.max(25,70-difficulty*4)}
  coinTimer--;
  if(coinTimer<=0){spawnCoin();if(Math.random()<0.5)spawnCoin();coinTimer=Math.max(18,50-difficulty*3)}

  // Rocks (floating)
  for(let i=rocks.length-1;i>=0;i--){
    const r=rocks[i];r.x-=speedNow-r.sp;
    const sx=r.x-scrollX+W;
    if(sx<-60){rocks.splice(i,1);continue}
    // Collision
    if(P.inv<=0&&Math.hypot(P.x-sx,P.y-r.y)<P.r+r.r-4){
      P.hp--;P.inv=50;shakeA=15;flashA=0.45;
      SP(P.x,P.y,20,'#FF6600',7);
      if(P.hp<=0){GO=true;document.getElementById('bigmsg').innerHTML='💀 CRASHED! 💀\n<small>Distance: '+distance+'m | Coins: '+coins+'</small>\n<small>Click to restart</small>'}
    }
  }

  // Trees (ground)
  for(let i=trees.length-1;i>=0;i--){
    const t=trees[i];t.x-=speedNow;
    const sx=t.x-scrollX+W;
    if(sx<-100){trees.splice(i,1);continue}
    // Trunk collision
    const trunkLeft=sx-t.trunkW/2,trunkRight=sx+t.trunkW/2;
    const trunkTop=H-t.trunkH-30;
    if(P.inv<=0&&P.x+P.r>trunkLeft&&P.x-P.r<trunkRight&&P.y+P.r>trunkTop){
      P.hp--;P.inv=50;shakeA=15;flashA=0.45;
      SP(P.x,P.y,20,'#44AA44',7);
      if(P.hp<=0){GO=true;document.getElementById('bigmsg').innerHTML='💀 CRASHED! 💀\n<small>Distance: '+distance+'m | Coins: '+coins+'</small>\n<small>Click to restart</small>'}
    }
    // Canopy collision
    if(P.inv<=0&&Math.hypot(P.x-sx,P.y-(H-t.trunkH-t.canopyR-30))<P.r+t.canopyR-6){
      P.hp--;P.inv=50;shakeA=15;flashA=0.45;
      SP(P.x,P.y,20,'#44AA44',7);
      if(P.hp<=0){GO=true;document.getElementById('bigmsg').innerHTML='💀 CRASHED! 💀\n<small>Distance: '+distance+'m | Coins: '+coins+'</small>\n<small>Click to restart</small>'}
    }
  }

  // Coins
  for(let i=pickups.length-1;i>=0;i--){
    const pk=pickups[i];pk.x-=speedNow;pk.pu+=0.1;pk.life--;
    const sx=pk.x-scrollX+W;
    if(sx<-50||pk.life<=0){pickups.splice(i,1);continue}
    if(Math.hypot(P.x-sx,P.y-pk.y)<P.r+pk.r+8){
      coins++;SP(sx,pk.y,10,'#FFD700',4);pickups.splice(i,1);
    }
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx-speedNow*0.5;p.y+=p.vy;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }

  // Clouds scroll
  for(const cl of clouds){cl.x-=cl.sp;if(cl.x<-cl.w){cl.x=W+Math.random()*100;cl.y=30+Math.random()*120}}

  document.getElementById('sc').textContent='🦅 '+distance+'m';
  document.getElementById('hp').textContent='❤️ '+P.hp;
  document.getElementById('co').textContent='🪙 '+coins;
  document.getElementById('sp').textContent='💨 x'+(speedNow/speedBase).toFixed(1);
}

// === DRAW EAGLE ===
function drawEagle(x,y,vy,flap,boost){
  X.save();X.translate(x,y);
  const tilt=vy*2;
  X.rotate(tilt*0.05);

  // Boost trail
  if(boost){
    X.fillStyle='rgba(255,200,0,0.6)';
    for(let i=0;i<5;i++){
      const bx=-25-i*12+Math.random()*8,by=(Math.random()-0.5)*18;
      X.beginPath();X.arc(bx,by,3+Math.random()*3,0,Math.PI*2);X.fill();
    }
  }

  X.shadowColor='#FFD700';X.shadowBlur=16;

  // Wings (flapping)
  const wingAngle=Math.sin(flap)*0.7;
  // Left wing
  X.save();X.translate(-6,-6);X.rotate(-0.4-wingAngle);
  X.fillStyle='#B8860B';
  X.beginPath();X.moveTo(0,0);X.quadraticCurveTo(-38,-20,-44,-2);X.quadraticCurveTo(-32,10,-6,5);X.closePath();X.fill();
  X.strokeStyle='#8B6914';X.lineWidth=1.5;X.stroke();
  X.restore();
  // Right wing
  X.save();X.translate(6,-6);X.rotate(0.4+wingAngle);
  X.fillStyle='#B8860B';
  X.beginPath();X.moveTo(0,0);X.quadraticCurveTo(38,-20,44,-2);X.quadraticCurveTo(32,10,6,5);X.closePath();X.fill();
  X.strokeStyle='#8B6914';X.lineWidth=1.5;X.stroke();
  X.restore();

  // Body
  X.fillStyle='#DAA520';X.beginPath();X.ellipse(0,0,13,20,0,0,Math.PI*2);X.fill();
  X.fillStyle='#F0C75E';X.beginPath();X.ellipse(0,4,8,14,0,0,Math.PI*2);X.fill();

  // Tail
  X.fillStyle='#8B6914';
  X.beginPath();X.moveTo(-4,16);X.quadraticCurveTo(-9,34,0,38);X.quadraticCurveTo(9,34,4,16);X.closePath();X.fill();

  // Head
  X.fillStyle='#1a1a1a';X.beginPath();X.arc(0,-20,11,0,Math.PI*2);X.fill();
  X.fillStyle='#FFF';X.beginPath();X.arc(0,-22,8,Math.PI,0);X.fill();

  // Eyes
  X.fillStyle='#FFD700';X.shadowColor='#FF0000';X.shadowBlur=9;
  X.beginPath();X.arc(-4,-21,3.5,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(4,-21,3.5,0,Math.PI*2);X.fill();
  X.fillStyle='#000';X.shadowBlur=0;
  X.beginPath();X.arc(-4,-21,1.8,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(4,-21,1.8,0,Math.PI*2);X.fill();

  // Beak
  X.fillStyle='#FF8C00';
  X.beginPath();X.moveTo(-3,-16);X.lineTo(0,-9);X.lineTo(3,-16);X.closePath();X.fill();

  // Talons tucked
  X.strokeStyle='#FF8C00';X.lineWidth=2;
  X.beginPath();X.moveTo(-5,18);X.lineTo(-9,24);X.moveTo(5,18);X.lineTo(9,24);X.stroke();

  X.shadowBlur=0;X.restore();
}

// === DRAW ===
function DR(){
  // Sky
  const sky=X.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#1a3a6e');sky.addColorStop(0.5,'#4a8ec2');sky.addColorStop(1,'#87CEEB');
  X.fillStyle=sky;X.fillRect(0,0,W,H);

  // Sun
  X.fillStyle='rgba(255,240,200,0.3)';X.beginPath();X.arc(W-100,70,80,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(255,255,220,0.6)';X.beginPath();X.arc(W-100,70,40,0,Math.PI*2);X.fill();

  // Mountains (far)
  for(const m of mountains){
    const sx=m.x-scrollX*0.2;
    const mx=((sx%((W+m.w)*2))+((W+m.w)*2))%((W+m.w)*2)-m.w;
    X.fillStyle='#5a7a8a';
    X.beginPath();X.moveTo(mx,H-30);X.lineTo(mx+m.w/2,H-30-m.h);X.lineTo(mx+m.w,H-30);X.closePath();X.fill();
    X.fillStyle='#6a8a9a';
    X.beginPath();X.moveTo(mx+m.w*0.2,H-30);X.lineTo(mx+m.w/2,H-30-m.h*0.85);X.lineTo(mx+m.w*0.8,H-30);X.closePath();X.fill();
  }

  // Clouds
  for(const cl of clouds){
    X.fillStyle='rgba(255,255,255,0.7)';
    X.beginPath();X.ellipse(cl.x,cl.y,cl.w/2,cl.h/2,0,0,Math.PI*2);X.fill();
    X.beginPath();X.ellipse(cl.x-cl.w*0.25,cl.y+cl.h*0.15,cl.w*0.35,cl.h*0.4,0,0,Math.PI*2);X.fill();
    X.beginPath();X.ellipse(cl.x+cl.w*0.25,cl.y+cl.h*0.1,cl.w*0.35,cl.h*0.4,0,0,Math.PI*2);X.fill();
  }

  let sx=0,sy=0;
  if(shakeA>0){sx=(Math.random()-0.5)*shakeA*2;sy=(Math.random()-0.5)*shakeA*2}
  X.save();X.translate(sx,sy);

  // Ground
  const groundY=H-30;
  X.fillStyle='#4a7a30';X.fillRect(0,groundY,W,H-groundY);
  X.fillStyle='#5a8a40';
  for(let i=((scrollX*0.5)%40)-40;i<W+40;i+=40){X.fillRect(i,groundY,20,10)}

  // Trees (ground obstacles)
  for(const t of trees){
    const sx=t.x-scrollX+W;
    if(sx<-120||sx>W+120)continue;
    // Trunk
    X.fillStyle='#5a3a1a';
    X.fillRect(sx-t.trunkW/2,H-t.trunkH-30,t.trunkW,t.trunkH);
    X.fillStyle='#4a2a0a';
    X.fillRect(sx-t.trunkW/4,H-t.trunkH-30,t.trunkW/2,t.trunkH);
    // Canopy
    X.fillStyle='#2a6a1a';
    X.beginPath();X.arc(sx,H-t.trunkH-t.canopyR-30,t.canopyR,0,Math.PI*2);X.fill();
    X.fillStyle='#3a8a2a';
    X.beginPath();X.arc(sx-8,H-t.trunkH-t.canopyR-25,t.canopyR*0.7,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(sx+8,H-t.trunkH-t.canopyR-25,t.canopyR*0.7,0,Math.PI*2);X.fill();
  }

  // Rocks (floating obstacles)
  for(const rk of rocks){
    const sx=rk.x-scrollX+W;
    if(sx<-60||sx>W+60)continue;
    X.fillStyle='#666';X.beginPath();X.arc(sx,rk.y,rk.r,0,Math.PI*2);X.fill();
    X.fillStyle='#777';X.beginPath();X.arc(sx-3,rk.y-3,rk.r*0.7,0,Math.PI*2);X.fill();
    X.fillStyle='#555';X.beginPath();X.arc(sx+2,rk.y+2,rk.r*0.5,0,Math.PI*2);X.fill();
  }

  // Coins
  for(const pk of pickups){
    const sx=pk.x-scrollX+W;
    if(sx<-50||sx>W+50)continue;
    const gl=0.5+Math.sin(pk.pu)*0.35;
    X.fillStyle=`rgba(255,215,0,${gl*0.35})`;
    X.beginPath();X.arc(sx,pk.y,pk.r+5,0,Math.PI*2);X.fill();
    X.fillStyle='#FFD700';X.beginPath();X.arc(sx,pk.y,pk.r,0,Math.PI*2);X.fill();
    X.fillStyle='#DAA520';X.beginPath();X.arc(sx,pk.y,pk.r-2,0,Math.PI*2);X.fill();
    X.fillStyle='#8B6914';X.font='bold 10px Arial';X.textAlign='center';X.fillText('$',sx,pk.y+4);X.textAlign='start';
  }

  // Particles
  for(const p of particles){
    const sx=p.x-scrollX+W,al=p.life/p.ml;
    X.globalAlpha=al;X.fillStyle=p.c;
    X.beginPath();X.arc(sx,p.y,p.r,0,Math.PI*2);X.fill();
  }
  X.globalAlpha=1;

  // Invincibility glow
  if(P.inv>0&&P.inv%6<3){X.fillStyle='rgba(255,255,0,0.25)';X.beginPath();X.arc(P.x,P.y,P.r+10,0,Math.PI*2);X.fill()}

  // Player
  drawEagle(P.x,P.y,P.vy,P.flap,P.boost>0);

  X.restore();

  // Flash
  if(flashA>0){X.fillStyle=`rgba(255,0,0,${flashA})`;X.fillRect(0,0,W,H)}

  // Ground line
  X.strokeStyle='#3a5a20';X.lineWidth=3;X.beginPath();X.moveTo(0,H-30);X.lineTo(W,H-30);X.stroke();
}

C.addEventListener('click',()=>{if(GO)RS()});

function loop(){UP();DR();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
