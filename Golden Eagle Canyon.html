<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦅 GOLDEN EAGLE - Canyon Rush</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Arial Black',sans-serif}
canvas{display:block}
#hh{position:absolute;top:8px;left:12px;pointer-events:none;z-index:2}
#hh div{color:#FFF;font-size:14px;text-shadow:0 0 10px rgba(0,0,0,0.7);margin:2px 0;line-height:1.6}
#barr{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:220px;height:18px;border:2px solid #FFD700;border-radius:9px;background:rgba(0,0,0,0.5);overflow:hidden;pointer-events:none;z-index:2}
#barrf{height:100%;background:linear-gradient(90deg,#FFA000,#FFD700,#FFA000);border-radius:7px;transition:width 0.3s;width:0%}
#bart{position:absolute;top:28px;left:50%;transform:translateX(-50%);color:#FFD700;font-size:11px;pointer-events:none;z-index:2;text-shadow:0 0 8px #000;white-space:nowrap}
#bmsg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#FFD700;font-size:32px;text-align:center;pointer-events:none;z-index:3;text-shadow:0 0 30px rgba(255,215,0,0.9),0 0 60px rgba(255,150,0,0.7);line-height:1.5;white-space:pre-line}
#bmsg small{font-size:14px;color:#ffe}
</style>
</head>
<body>
<canvas id="cc"></canvas>
<div id="hh">
  <div>🦅 <span id="dd">0m</span></div>
  <div>❤️ <span id="hp">3</span></div>
  <div>🏆 Level <span id="ll">1</span></div>
</div>
<div id="barr"><div id="barrf"></div></div>
<div id="bart">🍯 COLLECT HONEY</div>
<div id="bmsg"></div>

<script>
const C=document.getElementById('cc'),X=C.getContext('2d');
let W,H;
function RSZ(){W=C.width=innerWidth;H=C.height=innerHeight}
RSZ();addEventListener('resize',RSZ);

const KEYS={};let mdown=false,started=false,gameOver=false;
onkeydown=e=>{KEYS[e.key.toLowerCase()]=true;e.preventDefault()}
onkeyup=e=>{KEYS[e.key.toLowerCase()]=false}
C.onmousedown=()=>{if(!started){startGame();return}mdown=true}
C.onmouseup=()=>mdown=false
C.onclick=()=>{if(gameOver){resetAll();startGame()}}
oncontextmenu=e=>e.preventDefault()

// === GAME STATE ===
let scrollX,distance,level,honey,honeyGoal,lives,maxLives;
let speedBase,speedNow;
let shrinkTimer,rockTimer,honeyTimer;
let walls=[],rocks=[],honeys=[],particles=[];
let shakeAmt,flashAmt,invTimer;
let boostFuel,boostMax;

// === PLAYER ===
const PL={x:140,r:16};

function resetAll(){
  RSZ();
  PL.y=H/2;PL.vy=0;
  scrollX=0;distance=0;honey=0;level=1;honeyGoal=5;
  lives=3;maxLives=3;
  speedBase=2.2;speedNow=2.2;
  shrinkTimer=0;rockTimer=50;honeyTimer=30;
  walls=[];rocks=[];honeys=[];particles=[];
  shakeAmt=0;flashAmt=0;invTimer=0;
  boostFuel=100;boostMax=100;
  started=false;gameOver=false;
  PL.flap=0;
  document.getElementById('bmsg').innerHTML='🦅 GOLDEN EAGLE 🦅\n<small>CANYON RUSH</small>\n\n🍯 COLLECT HONEY TO ADVANCE!\n👆 <small>CLICK TO START FLYING</small>\n<small>W/↑ = fly up | S/↓ = dive | CLICK = BOOST</small>';
  document.getElementById('barrf').style.width='0%';
  document.getElementById('bart').textContent='🍯 COLLECT HONEY';
  document.getElementById('dd').textContent='0m';
  document.getElementById('hp').textContent='3';
  document.getElementById('ll').textContent='1';
}

function startGame(){started=true;document.getElementById('bmsg').innerHTML=''}

function spawn(x,y,n,c,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=spd*(0.3+Math.random());
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:14+Math.random()*20,ml:34,c,r:1+Math.random()*3.5})
  }
}

function levelUp(){
  level++;
  honey=0;
  honeyGoal=4+level*2; // 6, 8, 10, 12...
  speedBase=2.2+level*0.5;
  if(speedBase>20)speedBase=20;
  speedNow=speedBase;
  // Clear obstacles for fresh level start
  walls=[];rocks=[];honeys=[];
  PL.inv=80;
  document.getElementById('bmsg').innerHTML='🏆 LEVEL '+level+' 🏆\n<small>Collect '+honeyGoal+' 🍯</small>';
  document.getElementById('ll').textContent=level;
  document.getElementById('bart').textContent='🍯 '+honey+'/'+honeyGoal;
  document.getElementById('barrf').style.width='0%';
  setTimeout(()=>{if(!gameOver)document.getElementById('bmsg').innerHTML=''},1500);
}

function damage(){
  if(invTimer>0)return;
  lives--;invTimer=70;shakeAmt=16;flashAmt=0.5;
  spawn(PL.x,PL.y,25,'#FF4400',8);
  document.getElementById('hp').textContent=lives;
  if(lives<=0){
    gameOver=true;started=false;
    document.getElementById('bmsg').innerHTML='💀 CRASHED! 💀\n<small>Level '+level+' | '+distance+'m | 🍯 '+honey+'</small>\n\n<small>CLICK TO RESTART</small>';
  }
}

// Canyon wall generation
function addWallGap(){
  const minGap=Math.max(110,190-level*7);
  const gapCenter=50+(H-120)*Math.random();
  const w={x:W+scrollX,gapY:gapCenter,gapH:minGap,w:10+Math.random()*6};
  walls.push(w);
}

// Floating rock
function addRock(){
  rocks.push({x:W+scrollX+30,y:30+Math.random()*(H-80),r:8+Math.random()*12});
}

// Honey pickup
function addHoney(){
  honeys.push({x:W+scrollX+20,y:30+Math.random()*(H-80),r:11,phase:Math.random()*Math.PI*2});
}

// === UPDATE ===
function UP(){
  if(!started||gameOver)return;

  if(invTimer>0)invTimer--;
  shakeAmt*=0.84;if(shakeAmt<0.05)shakeAmt=0;
  flashAmt*=0.86;if(flashAmt<0.005)flashAmt=0;

  // Speed
  speedNow=speedBase;
  if(mdown&&boostFuel>0){speedNow=speedBase*1.8;boostFuel-=0.8}else{boostFuel=Math.min(boostMax,boostFuel+0.3)}

  // Flight
  const up=KEYS.w||KEYS.arrowup,down=KEYS.s||KEYS.arrowdown;
  PL.vy+=(up?-0.55:(down?0.35:0.2));
  PL.vy*=0.94;
  PL.vy=Math.max(-9,Math.min(9,PL.vy));
  PL.y+=PL.vy;
  PL.y=Math.max(PL.r+5,Math.min(H-PL.r-5,PL.y));

  // Flap
  if(up||(mdown&&boostFuel>0)){PL.flap+=0.45}else{PL.flap*=0.88}

  // Scroll
  scrollX+=speedNow;
  distance=Math.floor(scrollX/10);

  // Spawn
  shrinkTimer--;
  if(shrinkTimer<=0){addWallGap();shrinkTimer=Math.max(50,100-level*4)}
  rockTimer--;
  if(rockTimer<=0&&level>=2){addRock();rockTimer=Math.max(22,60-level*3)}
  honeyTimer--;
  if(honeyTimer<=0){addHoney();if(Math.random()<0.4)addHoney();honeyTimer=Math.max(15,45-level*3)}

  // Walls
  for(let i=walls.length-1;i>=0;i--){
    const w=walls[i];w.x-=speedNow;
    const sx=w.x-scrollX+W;
    if(sx<-60){walls.splice(i,1);continue}
    // Collision with top/bottom wall
    if(invTimer<=0){
      const topY=w.gapY-w.gapH/2-5,botY=w.gapY+w.gapH/2+5;
      if(PL.y-PL.r<topY||PL.y+PL.r>botY){
        if(PL.x+PL.r>sx-w.w/2&&PL.x-PL.r<sx+w.w/2){damage()}
      }
    }
  }

  // Rocks
  for(let i=rocks.length-1;i>=0;i--){
    const rk=rocks[i];rk.x-=speedNow;
    const sx=rk.x-scrollX+W;
    if(sx<-60){rocks.splice(i,1);continue}
    if(invTimer<=0&&Math.hypot(PL.x-sx,PL.y-rk.y)<PL.r+rk.r-3){damage()}
  }

  // Honey
  for(let i=honeys.length-1;i>=0;i--){
    const hn=honeys[i];hn.x-=speedNow;hn.phase+=0.08;
    const sx=hn.x-scrollX+W;
    if(sx<-50){honeys.splice(i,1);continue}
    if(Math.hypot(PL.x-sx,PL.y-hn.y)<PL.r+hn.r+10){
      honey++;spawn(sx,hn.y,14,'#FFD700',5);honeys.splice(i,1);
      document.getElementById('bart').textContent='🍯 '+honey+'/'+honeyGoal;
      const pct=Math.min(100,Math.round(honey/honeyGoal*100));
      document.getElementById('barrf').style.width=pct+'%';
      if(honey>=honeyGoal){levelUp();return}
    }
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx-speedNow*0.4;p.y+=p.vy;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }

  // Boost trail
  if(mdown&&boostFuel>0&&Math.random()<0.6)spawn(PL.x-20,PL.y,1,'#FFD700',3);

  document.getElementById('dd').textContent=distance+'m';
}

// === DRAW EAGLE ===
function drawEagle(x,y,flap,boost){
  X.save();X.translate(x,y);
  const tilt=PL.vy*1.8;
  X.rotate(tilt*0.04);

  // Boost glow
  if(boost){
    X.fillStyle='rgba(255,200,0,0.5)';
    for(let i=0;i<6;i++){
      const bx=-22-i*10+Math.random()*6,by=(Math.random()-0.5)*14;
      X.beginPath();X.arc(bx,by,2.5+Math.random()*3,0,Math.PI*2);X.fill();
    }
  }

  X.shadowColor='#FFD700';X.shadowBlur=12;

  const wa=Math.sin(flap)*0.8;
  // Left wing
  X.save();X.translate(-5,-5);X.rotate(-0.35-wa);
  X.fillStyle='#C8960C';
  X.beginPath();X.moveTo(0,0);X.quadraticCurveTo(-42,-22,-48,0);X.quadraticCurveTo(-34,12,-5,6);X.closePath();X.fill();
  X.strokeStyle='#8B6914';X.lineWidth=1.5;X.stroke();
  X.restore();
  // Right wing
  X.save();X.translate(5,-5);X.rotate(0.35+wa);
  X.fillStyle='#C8960C';
  X.beginPath();X.moveTo(0,0);X.quadraticCurveTo(42,-22,48,0);X.quadraticCurveTo(34,12,5,6);X.closePath();X.fill();
  X.strokeStyle='#8B6914';X.lineWidth=1.5;X.stroke();
  X.restore();

  // Body
  X.fillStyle='#DAA520';X.beginPath();X.ellipse(0,0,14,22,0,0,Math.PI*2);X.fill();
  X.fillStyle='#F5D060';X.beginPath();X.ellipse(0,5,9,15,0,0,Math.PI*2);X.fill();

  // Tail feathers
  X.fillStyle='#8B6914';
  X.beginPath();X.moveTo(-5,17);X.quadraticCurveTo(-10,36,0,40);X.quadraticCurveTo(10,36,5,17);X.closePath();X.fill();
  X.fillStyle='#A07818';X.beginPath();X.moveTo(-3,18);X.quadraticCurveTo(-5,32,0,35);X.quadraticCurveTo(5,32,3,18);X.closePath();X.fill();

  // Head
  X.fillStyle='#2a1a0a';X.beginPath();X.arc(0,-22,12,0,Math.PI*2);X.fill();
  X.fillStyle='#FFF';X.beginPath();X.arc(0,-24,9,Math.PI,0);X.fill();

  // Golden eyes
  X.fillStyle='#FFD700';X.shadowColor='#FF6600';X.shadowBlur=8;
  X.beginPath();X.arc(-5,-23,3.8,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(5,-23,3.8,0,Math.PI*2);X.fill();
  X.fillStyle='#000';X.shadowBlur=0;
  X.beginPath();X.arc(-5,-23,2,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(5,-23,2,0,Math.PI*2);X.fill();

  // Beak
  X.fillStyle='#FF8C00';X.beginPath();X.moveTo(-4,-17);X.lineTo(0,-10);X.lineTo(4,-17);X.closePath();X.fill();
  X.fillStyle='#FF6600';X.beginPath();X.moveTo(-2,-16);X.lineTo(0,-11);X.lineTo(2,-16);X.closePath();X.fill();

  // Talons
  X.strokeStyle='#FF8C00';X.lineWidth=2;
  X.beginPath();X.moveTo(-4,20);X.lineTo(-7,26);X.moveTo(4,20);X.lineTo(7,26);X.stroke();

  X.shadowBlur=0;X.restore();
}

// === DRAW ===
function DR(){
  // Sky gradient
  const g1=X.createLinearGradient(0,0,0,H);
  g1.addColorStop(0,'#1a4380');g1.addColorStop(0.35,'#3a7ec0');g1.addColorStop(0.65,'#6ab8e0');g1.addColorStop(1,'#87CEEB');
  X.fillStyle=g1;X.fillRect(0,0,W,H);

  // Sun
  X.fillStyle='rgba(255,240,200,0.25)';X.beginPath();X.arc(W-110,65,90,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(255,255,230,0.55)';X.beginPath();X.arc(W-110,65,45,0,Math.PI*2);X.fill();
  X.fillStyle='rgba(255,255,245,0.8)';X.beginPath();X.arc(W-110,65,22,0,Math.PI*2);X.fill();

  // Far mountains
  for(let i=0;i<10;i++){
    const mx=((i*320-scrollX*0.15)%((W+400)))-200;
    X.fillStyle='#7a9ab0';
    X.beginPath();X.moveTo(mx,H-40);X.lineTo(mx+130,H-40-Math.abs(Math.sin(i*1.7))*140-60);X.lineTo(mx+260,H-40);X.closePath();X.fill();
    X.fillStyle='#8aacbf';
    X.beginPath();X.moveTo(mx+50,H-40);X.lineTo(mx+130,H-40-Math.abs(Math.sin(i*1.7))*140-80);X.lineTo(mx+210,H-40);X.closePath();X.fill();
  }

  // Clouds
  for(let i=0;i<10;i++){
    const cx=((i*280-scrollX*0.3)%((W+400)))-140,cy=35+Math.sin(i*2.3)*50;
    X.fillStyle='rgba(255,255,255,0.6)';
    X.beginPath();X.ellipse(cx,cy,55,18,0,0,Math.PI*2);X.fill();
    X.beginPath();X.ellipse(cx-35,cy+7,38,14,0,0,Math.PI*2);X.fill();
    X.beginPath();X.ellipse(cx+35,cy+5,40,15,0,0,Math.PI*2);X.fill();
  }

  let ssx=0,ssy=0;
  if(shakeAmt>0){ssx=(Math.random()-0.5)*shakeAmt*2;ssy=(Math.random()-0.5)*shakeAmt*2}
  X.save();X.translate(ssx,ssy);

  // Canyon walls
  for(const w of walls){
    const sx=w.x-scrollX+W;
    if(sx<-60||sx>W+60)continue;
    // Top wall
    const gw=w.w;
    X.fillStyle='#C46A20';X.fillRect(sx-gw/2,0,gw,w.gapY-w.gapH/2);
    X.fillStyle='#D48030';X.fillRect(sx-gw*0.65,0,gw*0.35,w.gapY-w.gapH/2);
    X.fillStyle='#A05010';X.fillRect(sx+gw*0.3,0,gw*0.2,w.gapY-w.gapH/2);
    // Bottom wall
    X.fillStyle='#C46A20';X.fillRect(sx-gw/2,w.gapY+w.gapH/2,gw,H-(w.gapY+w.gapH/2));
    X.fillStyle='#D48030';X.fillRect(sx-gw*0.65,w.gapY+w.gapH/2,gw*0.35,H-(w.gapY+w.gapH/2));
    X.fillStyle='#A05010';X.fillRect(sx+gw*0.3,w.gapY+w.gapH/2,gw*0.2,H-(w.gapY+w.gapH/2));
    // Edge highlights
    X.strokeStyle='#E8A050';X.lineWidth=2;
    X.beginPath();X.moveTo(sx-gw/2,w.gapY-w.gapH/2);X.lineTo(sx+gw/2,w.gapY-w.gapH/2);X.stroke();
    X.beginPath();X.moveTo(sx-gw/2,w.gapY+w.gapH/2);X.lineTo(sx+gw/2,w.gapY+w.gapH/2);X.stroke();
  }

  // Ground
  const gy=H-25;
  X.fillStyle='#4a7a30';X.fillRect(0,gy,W,H-gy);
  X.fillStyle='#5a8a40';
  for(let i=((scrollX*0.5)%50)-50;i<W+50;i+=50){X.fillRect(i,gy,25,12)}

  // Rocks
  for(const rk of rocks){
    const sx=rk.x-scrollX+W;
    if(sx<-60||sx>W+60)continue;
    X.fillStyle='#777';X.beginPath();X.arc(sx,rk.y,rk.r,0,Math.PI*2);X.fill();
    X.fillStyle='#888';X.beginPath();X.arc(sx-3,rk.y-3,rk.r*0.65,0,Math.PI*2);X.fill();
    X.fillStyle='#555';X.beginPath();X.arc(sx+2,rk.y+2,rk.r*0.45,0,Math.PI*2);X.fill();
  }

  // Honey pickups
  for(const hn of honeys){
    const sx=hn.x-scrollX+W;
    if(sx<-50||sx>W+50)continue;
    const gl=0.7+Math.sin(hn.phase)*0.25;
    X.fillStyle=`rgba(255,200,0,${gl*0.4})`;
    X.beginPath();X.arc(sx,hn.y,hn.r+6,0,Math.PI*2);X.fill();
    // Honey pot shape
    X.fillStyle='#FFA500';
    X.beginPath();X.arc(sx,hn.y,hn.r,Math.PI*0.2,Math.PI*1.8);X.fill();
    X.fillStyle='#FFD700';
    X.beginPath();X.arc(sx,hn.y,hn.r*0.75,Math.PI,0);X.fill();
    // Honey drip
    X.fillStyle='#FFB800';
    X.beginPath();X.ellipse(sx,hn.y+6,hn.r*0.6,hn.r*0.35,0,0,Math.PI*2);X.fill();
    // 🍯 emoji
    X.font='bold 14px Arial';X.textAlign='center';X.fillText('🍯',sx,hn.y+5);X.textAlign='start';
  }

  // Particles
  for(const p of particles){
    const sx=p.x-scrollX+W,al=p.life/p.ml;
    X.globalAlpha=al;X.fillStyle=p.c;
    X.beginPath();X.arc(sx,p.y,p.r,0,Math.PI*2);X.fill();
  }
  X.globalAlpha=1;

  // Invincibility glow
  if(invTimer>0&&invTimer%6<3){X.fillStyle='rgba(255,255,80,0.3)';X.beginPath();X.arc(PL.x,PL.y,PL.r+12,0,Math.PI*2);X.fill()}

  // Draw eagle
  drawEagle(PL.x,PL.y,PL.flap,mdown&&boostFuel>0);

  X.restore();

  // Flash
  if(flashAmt>0){X.fillStyle=`rgba(255,0,0,${flashAmt})`;X.fillRect(0,0,W,H)}
}

function loop(){UP();DR();requestAnimationFrame(loop)}
resetAll();
loop();
</script>
</body>
</html>
